// ===== HTML譖ｸ縺榊・縺・=====
function normalizeExportPath(path) {
  const value = (path || '').trim();
  if (!value) return '';
  return /[\/\\]$/.test(value) ? value : value + '/';
}

function syncBackgroundExportPath(value) {
  bgExportPath = String(value || '').trim();
  syncActiveBlockFromState();
}

function getExportPaths() {
  return {
    asset: normalizeExportPath(document.getElementById('export-path')?.value || '../assets/toolassets/'),
    photo: normalizeExportPath(document.getElementById('export-photo-path')?.value || '../assets/reviews/hihyo/photos/')
  };
}

function exportAssetSrc(item, fallbackPath) {
  if (!item) return '';
  return item.src || (fallbackPath + item.filename);
}

function exportCardBackgroundSrc() {
  if (!bgDataUrl) return '';
  return bgExportPath || bgDataUrl;
}

function indentExportHTML(html, spaces) {
  const indent = ' '.repeat(spaces);
  return String(html || '').split('\n').map(line => line ? indent + line : line).join('\n');
}

function exportTextHTML(text) {
  return nl2br(text).replace(/<br>/g, '<br>\n');
}

function trimExportDecimals(html) {
  return String(html || '').replace(/-?\d+\.\d{3,}/g, value => {
    const rounded = Number(value).toFixed(2).replace(/\.?0+$/, '');
    return rounded === '-0' ? '0' : rounded;
  });
}

function buildCurrentHTML(exportPaths) {
  const paths = typeof exportPaths === 'string'
    ? { asset: normalizeExportPath(exportPaths), photo: normalizeExportPath(exportPaths) }
    : exportPaths;
  const assetPath = normalizeExportPath(paths?.asset || '../assets/toolassets/');
  const photoPath = normalizeExportPath(paths?.photo || '../assets/reviews/hihyo/photos/');
  const titleHtml = blockTitle ? `<p class="blue-tag">${h(blockTitle)}</p>\n` : '';
  const bodyHtml = dialogue.map(item => {
    const fontCss = item.font && item.font !== 'default' ? `font-family:${FONTS[item.font].css};` : '';
    if (item.type === 'action') {
      return `<p class="action"${fontCss ? ` style="${fontCss}"` : ''}>\n  ${exportTextHTML(item.text)}\n</p>`;
    }
    if (item.type === 'photo') {
      const src = exportAssetSrc(item, photoPath);
      const w = item.size || '100%';
      const caption = item.text ? `\n  <p class="photo-caption">${exportTextHTML(item.text)}</p>` : '';
      if (item.photoFrame === 'none') {
        return `<div class="photo-block is-plain">\n  <img src="${src}" alt="${h(item.filename)}" style="width:${w};max-width:100%;">${caption}\n</div>`;
      }
      return `<div class="photo-block is-paper" style="width:${w};max-width:100%;">\n  <img src="${src}" alt="${h(item.filename)}">${caption}\n</div>`;
    }
    const img = images.find(i => i.id === item.imageId);
    if (!img) return '';
    const name = img.charName || img.filename;
    const src = exportAssetSrc(img, assetPath);
    const sz = avatarStyle(img);
    const sym = item.symbolId ? images.find(i => i.id === item.symbolId) : null;
    const symHtml = sym
      ? `<img src="${exportAssetSrc(sym, assetPath)}" alt="${h(sym.symbolLabel || sym.filename)}" style="position:absolute;top:0;left:0;width:570px;height:570px;object-fit:contain;pointer-events:none;z-index:2;">`
      : '';
    const wrapStyle = `display:inline-block;position:relative;isolation:isolate;filter:drop-shadow(2px 3px 2px rgba(0,0,0,0.4));transform:translate(5px,0);`;
    const avatarMaskStyle = '-webkit-mask-image:linear-gradient(to bottom,#000 0 95%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0 95%,transparent 100%);';
    const avatarInner = sym
      ? `<div style="${wrapStyle}"><img src="${src}" alt="${h(name)}" class="avatar" style="width:570px;height:570px;margin:0;position:relative;z-index:1;${avatarMaskStyle}">${symHtml}</div>`
      : `<div style="${wrapStyle}"><img src="${src}" alt="${h(name)}" class="avatar"${sz ? ` style="${sz}object-fit:contain;position:relative;z-index:1;${avatarMaskStyle}"` : ` style="position:relative;z-index:1;${avatarMaskStyle}"`}></div>`;
    const nametag = getNametagForChar(img.charName);
    const nameHtml = nametag
      ? `<img src="${exportAssetSrc(nametag, assetPath)}" alt="${h(name)}" style="max-width:130px;width:100%;height:auto;display:block;margin:4px auto 0;object-fit:contain;">`
      : `<div class="name">${h(name)}</div>`;
    const bubbleColor = getBubbleColor(img.charName);
    const bubbleShadowColor = bubbleColor ? colorWithAlpha(bubbleColor, 0.55) : '';
    const inlineStyle = [
      bubbleColor ? `--bc:${bubbleColor};` : '',
      bubbleShadowColor ? `--bc-shadow:${bubbleShadowColor};` : '',
      fontCss
    ].filter(Boolean).join('');
    const bubbleStyle = inlineStyle ? ` style="${inlineStyle}"` : '';
    const renderedBubble = document.querySelector(`#preview-dialogue-box .bubble-path[data-dialogue-id="${item.id}"]`);
    const svgHtml = renderedBubble ? trimExportDecimals(renderedBubble.querySelector('svg').outerHTML) : '';
    const bubbleHtml = indentExportHTML(bubbleMarkup(item, bubbleStyle, exportTextHTML(item.text), svgHtml), 2);
    return `<div class="chat">
  <div class="avatar-block" style="position:relative">
    ${avatarInner}
    ${nameHtml}
  </div>
${bubbleHtml}
</div>`;
  }).filter(Boolean).join('\n\n\n');
  const backgroundSrc = exportCardBackgroundSrc();
  const backgroundHtml = backgroundSrc
    ? `\n  <img class="dialogue-card-background" src="${h(backgroundSrc)}" alt="" aria-hidden="true">`
    : '';
  return `${titleHtml}<section class="dialogue-card">${backgroundHtml}
  <div class="dialogue-card-panel">
${indentExportHTML(bodyHtml, 4)}
  </div>
</section>`;
}

function copyTextToClipboard(text, message) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showExportToast(message)).catch(() => fallbackCopy(text, () => showExportToast(message)));
  } else {
    fallbackCopy(text, () => showExportToast(message));
  }
}

function copyHTML() {
  syncActiveBlockFromState();
  if (dialogue.length === 0) { alert('会話がありません。'); return; }
  const exportPaths = getExportPaths();
  renderPreview();
  updateBubblePaths(document.getElementById('preview-dialogue-box'));
  copyTextToClipboard(buildCurrentHTML(exportPaths), '現在ブロックのHTMLをコピーしました');
}

function copyAllHTML() {
  syncActiveBlockFromState();
  const filledBlocks = blocks.filter(block => (block.dialogue || []).length > 0);
  if (filledBlocks.length === 0) { alert('会話がありません。'); return; }
  const exportPaths = getExportPaths();
  const originalId = activeBlockId;
  const htmlList = [];
  filledBlocks.forEach(block => {
    loadBlockIntoState(block);
    renderPreview();
    updateBubblePaths(document.getElementById('preview-dialogue-box'));
    htmlList.push(buildCurrentHTML(exportPaths));
  });
  loadBlockIntoState(blocks.find(block => block.id === originalId) || blocks[0]);
  copyTextToClipboard(htmlList.join('\n\n'), '全ブロックのHTMLをコピーしました');
}

function plainDialogueText(text) {
  return String(text || '')
    .replace(/<br\s*\/?\s*>/gi, '\n')
    .replace(/<[^>]*>/g, '');
}

function buildDialogueText() {
  const filledBlocks = blocks.filter(block => block.blockTitle || (block.dialogue || []).length > 0);
  return filledBlocks.map(block => {
    const lines = [];
    if (block.blockTitle) lines.push(`【${block.blockTitle}】`);
    (block.dialogue || []).forEach(item => {
      if (item.type === 'action') {
        const text = plainDialogueText(item.text);
        if (text) lines.push(`（${text}）`);
        return;
      }
      if (item.type === 'photo') {
        const label = item.filename ? `写真：${item.filename}` : '写真';
        const text = plainDialogueText(item.text);
        lines.push(text ? `［${label}］ ${text}` : `［${label}］`);
        return;
      }
      const image = images.find(img => img.id === item.imageId);
      const name = image ? (image.charName || image.filename) : '不明';
      lines.push(`${name}「${plainDialogueText(item.text)}」`);
    });
    return lines.join('\n');
  }).filter(Boolean).join('\n\n\n');
}

function exportDialogueText() {
  syncActiveBlockFromState();
  const text = buildDialogueText();
  if (!text) { alert('書き出す会話がありません。'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dialogue-blocks-text.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  showExportToast('会話テキストを書き出しました');
}

function showExportToast(message) {
  const toast = document.getElementById('copy-toast');
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(showExportToast.timer);
  showExportToast.timer = setTimeout(() => toast.style.display = 'none', 2200);
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  cb();
}

// ===== 繝励Ο繧ｸ繧ｧ繧ｯ繝井ｿ晏ｭ倥・隱ｭ縺ｿ霎ｼ縺ｿ =====
function saveProject() {
  syncActiveBlockFromState();
  const data = {
    version: 2,
    mode: 'multi-block',
    activeBlockId,
    images: images.map(({ id, filename, src, type, charName, exprLabel, symbolLabel, nw, nh, charColor }) => ({ id, filename, src: src || '', type: type || 'char', charName, exprLabel, symbolLabel: symbolLabel || '', nw: nw || 0, nh: nh || 0, charColor: charColor || '' })),
    blocks: blocks.map(block => ({
      id: block.id,
      blockTitle: block.blockTitle || '',
      bgDataUrl: block.bgDataUrl || null,
      bgExportPath: block.bgExportPath || '',
      dialogue: cloneDialogueItems(block.dialogue)
    }))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dialogue-blocks-project.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function triggerLoad() { document.getElementById('load-input').click(); }

function mergeProjectImages(projectImages) {
  const currentByFilename = new Map(images.map(image => [image.filename, image]));
  const projectFilenames = new Set();
  const merged = (projectImages || []).map(projectImage => {
    projectFilenames.add(projectImage.filename);
    const currentImage = currentByFilename.get(projectImage.filename);
    if (!currentImage) return { ...projectImage, dataUrl: '' };
    return {
      ...projectImage,
      dataUrl: currentImage.dataUrl || '',
      src: currentImage.src || '',
      type: currentImage.type || 'char',
      charName: currentImage.charName || '',
      exprLabel: currentImage.exprLabel || '',
      symbolLabel: currentImage.symbolLabel || '',
      charColor: currentImage.charColor || '',
      nw: currentImage.nw || projectImage.nw || 0,
      nh: currentImage.nh || projectImage.nh || 0
    };
  });
  images.forEach(currentImage => {
    if (!projectFilenames.has(currentImage.filename)) merged.push(currentImage);
  });
  return merged;
}

function onLoadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let loadPhase = 'プロジェクトファイルの解析';
    try {
      const data = JSON.parse(ev.target.result);
      loadPhase = '画像一覧の復元';
      images = mergeProjectImages(data.images);
      if (Array.isArray(data.blocks)) {
        loadPhase = '会話ブロックの復元';
        blocks = data.blocks.map(block => ({
          id: block.id || uid(),
          blockTitle: (block.blockTitle || '').trim(),
          bgDataUrl: block.bgDataUrl || null,
          bgExportPath: (block.bgExportPath || '').trim(),
          dialogue: cloneDialogueItems(block.dialogue).filter(d => d.type !== 'heading')
        })).filter(block => block.dialogue.length > 0 || block.blockTitle || block.bgDataUrl);
        if (blocks.length === 0) blocks = [createBlock('')];
        activeBlockId = blocks.some(block => block.id === data.activeBlockId) ? data.activeBlockId : blocks[0].id;
      } else {
        loadPhase = '旧形式の会話データの復元';
        const loadedDialogue = (data.dialogue || []).map(d => ({ type: 'chat', bubbleShape: 'normal', ...d, side: 'left' }));
        const legacyHeading = loadedDialogue.find(d => d.type === 'heading');
        blocks = [{
          id: uid(),
          blockTitle: (data.blockTitle || (legacyHeading && legacyHeading.text) || '').trim(),
          bgDataUrl: data.bgDataUrl || null,
          bgExportPath: (data.bgExportPath || '').trim(),
          dialogue: loadedDialogue.filter(d => d.type !== 'heading')
        }];
        activeBlockId = blocks[0].id;
      }
      loadPhase = '素材一覧の表示';
      renderImageGrid();
      renderCharSelect();
      loadPhase = '会話プレビューの表示';
      loadBlockIntoState(getActiveBlock());
      const missing = images.filter(i => !i.dataUrl).length;
      if (missing > 0) {
        alert(`読み込み完了。\n画像 ${missing} 件が未登録です。ドラッグ＆ドロップで画像を再登録してください。（ファイル名が一致すれば自動で紐付けされます）`);
      }
    } catch (err) {
      const detail = err instanceof Error ? err.message : String(err);
      console.error(`プロジェクト読み込みエラー（${loadPhase}）`, err);
      alert(`読み込み中にエラーが起きました。\n場所: ${loadPhase}\n詳細: ${detail}`);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===== 繝ｦ繝ｼ繝・ぅ繝ｪ繝・ぅ =====
function h(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function nl2br(s) {
  return h(s)
    .replace(/&lt;b&gt;/g, '<b>')
    .replace(/&lt;\/b&gt;/g, '</b>')
    .replace(/&lt;font=(default|mincho|pop)&gt;/g, (_, font) => `<span style="font-family:${FONTS[font].css};">`)
    .replace(/&lt;\/font&gt;/g, '</span>')
    .replace(/&lt;size=(large|small)&gt;/g, (_, size) => `<span style="font-size:${size === 'large' ? '1.25em' : '0.85em'};">`)
    .replace(/&lt;\/size&gt;/g, '</span>')
    .replace(/\n/g, '<br>');
}

document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
initBlockManager();
