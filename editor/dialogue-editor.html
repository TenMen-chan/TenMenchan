<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>複数会話ブロックエディター newUI2</title>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
  background: #e8e8e8;
  color: #333;
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 繝倥ャ繝繝ｼ */
header {
  background: #2c2c2c;
  color: #fff;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 1px solid #111;
}
header h1 { font-size: 15px; font-weight: 600; margin-right: auto; letter-spacing: 0.5px; }
header button {
  padding: 6px 14px;
  border: 1px solid #555;
  background: #3a3a3a;
  color: #eee;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}
header button:hover { background: #555; }
header button.accent {
  background: #1a6fc4;
  border-color: #155aa0;
  color: #fff;
}
header button.accent:hover { background: #2280d8; }

/* 3繝壹う繝ｳ繝ｬ繧､繧｢繧ｦ繝・*/
.main {
  display: grid;
  grid-template-columns: 270px 1fr 340px;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

/* 繝代ロ繝ｫ蜈ｱ騾・*/
.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #f4f4f4;
  border-right: 1px solid #ccc;
}
.panel:last-child { border-right: none; }

.panel-header {
  background: #ddd;
  padding: 8px 14px;
  font-weight: 700;
  font-size: 12px;
  color: #444;
  border-bottom: 1px solid #c4c4c4;
  flex-shrink: 0;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

/* =========== 蟾ｦ繝壹う繝ｳ: 逕ｻ蜒冗匳骭ｲ =========== */
.btn-folder {
  display: block;
  width: 100%;
  padding: 11px;
  background: #1a6fc4;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 8px;
  font-family: inherit;
  transition: background 0.15s;
}
.btn-folder:hover { background: #2280d8; }

.folder-info {
  font-size: 11px;
  color: #888;
  background: #ececec;
  border-radius: 4px;
  padding: 4px 8px;
  margin-bottom: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.btn-save-chars {
  display: block;
  width: 100%;
  padding: 7px;
  background: #f5f5f5;
  color: #444;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 10px;
  font-family: inherit;
  transition: background 0.12s;
}
.btn-save-chars:hover { background: #e8e8e8; }
.asset-update-buttons {
  display: grid;
  gap: 6px;
  margin-bottom: 8px;
}
.btn-asset-update {
  display: block;
  width: 100%;
  padding: 7px;
  background: #eef5ff;
  color: #1a5f9f;
  border: 1px solid #a9ccef;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s;
}
.btn-asset-update:hover { background: #ddeeff; }
.btn-asset-update.secondary {
  background: #f5f5f5;
  color: #555;
  border-color: #ccc;
}
.asset-update-info {
  font-size: 11px;
  color: #777;
  margin: -2px 0 8px;
  line-height: 1.45;
}

#drop-zone {
  border: 2px dashed #bbb;
  border-radius: 8px;
  padding: 18px 12px;
  text-align: center;
  color: #999;
  cursor: pointer;
  margin-bottom: 12px;
  transition: border-color 0.2s, background 0.2s;
  font-size: 13px;
  line-height: 1.6;
}
#drop-zone:hover { border-color: #1a6fc4; color: #1a6fc4; background: #f0f6ff; }
#drop-zone.drag-over { border-color: #1a6fc4; background: #e4f0ff; }

.image-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.img-card {
  background: #fff;
  border: 2px solid #e0e0e0;
  border-radius: 7px;
  padding: 7px;
  cursor: pointer;
  transition: border-color 0.15s;
  position: relative;
}
.img-card:hover { border-color: #1a6fc4; }
.img-card.selected { border-color: #1a6fc4; background: #eef5ff; }

.img-card .img-thumb {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 4px;
  display: block;
  margin-bottom: 5px;
  background: #eee;
}

.img-card .img-filename {
  font-size: 10px;
  color: #aaa;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 4px;
}

.img-card input[type=text] {
  width: 100%;
  font-size: 11px;
  padding: 3px 5px;
  border: 1px solid #ddd;
  border-radius: 3px;
  margin-bottom: 3px;
  background: #fafafa;
  font-family: inherit;
}
.img-card input[type=text]:focus {
  outline: none;
  border-color: #1a6fc4;
  background: #fff;
}
.img-card input[type=text]:last-child { margin-bottom: 0; }

.img-card .btn-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  background: rgba(180,0,0,0.75);
  color: #fff;
  border: none;
  border-radius: 3px;
  width: 18px;
  height: 18px;
  font-size: 11px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.img-card:hover .btn-remove { display: flex; }

/* =========== 荳ｭ繝壹う繝ｳ: 莨夊ｩｱ邱ｨ髮・=========== */
.add-form {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
}
.add-form .form-title {
  font-size: 12px;
  font-weight: 700;
  color: #666;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-row { margin-bottom: 9px; }
.form-row label {
  display: block;
  font-size: 11px;
  color: #888;
  margin-bottom: 3px;
  font-weight: 600;
}
.form-row select,
.form-row input[type=text] {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 13px;
  background: #fff;
  font-family: inherit;
  box-sizing: border-box;
}
.form-row select:focus,
.form-row input[type=text]:focus { outline: none; border-color: #1a6fc4; }

#expr-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 28px;
}
.expr-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  width: 56px;
}
.expr-thumb-clip {
  width: 56px; height: 56px; overflow: hidden; position: relative;
  border-radius: 5px; border: 2px solid #e0e0e0; transition: border-color 0.12s;
}
.expr-thumb-clip:hover { border-color: #1a6fc4; }
.expr-thumb-clip.selected { border-color: #1a6fc4; box-shadow: 0 0 0 2px #a0c4f8; }
.expr-thumb-inner {
  width: 100%; height: 155%;
  object-fit: cover; object-position: center; display: block;
  margin-top: -15%;
}
/* 蠕梧婿莠呈鋤 */
.expr-thumb {
  width: 56px; height: 56px; object-fit: cover;
  border-radius: 5px; border: 2px solid #e0e0e0; display: block;
}
.expr-label {
  font-size: 10px;
  color: #888;
  text-align: center;
  width: 56px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 2px;
}

/* 繝槭Φ繧ｬ險伜捷繝斐ャ繧ｫ繝ｼ */
#symbol-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  min-height: 22px;
}
.symbol-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  width: 44px;
}
.symbol-thumb {
  width: 44px;
  height: 44px;
  object-fit: contain;
  border-radius: 5px;
  border: 2px solid #e0e0e0;
  background: #f8f8f8;
  transition: border-color 0.12s;
}
.symbol-thumb:hover { border-color: #1a6fc4; }
.symbol-thumb.selected { border-color: #1a6fc4; box-shadow: 0 0 0 2px #a0c4f8; }
.symbol-label {
  font-size: 9px;
  color: #888;
  text-align: center;
  width: 44px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 2px;
}

/* 險伜捷繝舌ャ繧ｸ・育判蜒上げ繝ｪ繝・ラ・・*/
.symbol-badge {
  display: inline-block;
  background: #6c5ce7;
  color: #fff;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-bottom: 3px;
  font-weight: 700;
}

.bubble-shape-toggle {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px;
}
.bubble-shape-btn {
  padding: 5px 4px;
  border: 1px solid #ccc;
  background: #f5f5f5;
  border-radius: 4px;
  color: #666;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
}
.bubble-shape-btn.active {
  color: #fff;
  background: #1a6fc4;
  border-color: #155aa0;
}
#bubble-text {
  width: 100%;
  height: 72px;
  padding: 7px 9px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 13px;
  resize: vertical;
  font-family: inherit;
  line-height: 1.5;
}
#bubble-text:focus { outline: none; border-color: #1a6fc4; }

.btn-primary {
  width: 100%;
  padding: 8px;
  background: #1a6fc4;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 700;
  transition: background 0.15s;
}
.btn-primary:hover { background: #2280d8; }
.btn-primary.is-update { background: #1e9e50; }
.btn-primary.is-update:hover { background: #27b85e; }

.btn-cancel {
  display: none;
  width: 100%;
  padding: 6px;
  margin-top: 5px;
  border: 1px solid #ccc;
  background: #f2f2f2;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
}
.btn-cancel:hover { background: #e8e8e8; }

/* 莨夊ｩｱ繝ｪ繧ｹ繝・*/
.dialogue-list { display: flex; flex-direction: column; gap: 5px; }

.left-history-section {
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid #ddd;
}

.left-image-section {
  padding-top: 2px;
}

.section-title {
  margin: 0 0 8px;
  color: #555;
  font-size: 12px;
  font-weight: 700;
}

.section-note {
  margin: -4px 0 8px;
  color: #888;
  font-size: 11px;
  line-height: 1.5;
}

.block-manager-section {
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid #ddd;
}

.block-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-bottom: 8px;
}

.block-controls button {
  padding: 6px 4px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  font-family: inherit;
  color: #555;
}

.block-controls button:hover { background: #eef5ff; border-color: #9fc5ef; }
.block-controls .danger { color: #c00; border-color: #f0cccc; }
.block-controls .danger:hover { background: #fff0f0; }

.block-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.block-list:empty::before {
  content: "\u30d6\u30ed\u30c3\u30af\u306f\u307e\u3060\u3042\u308a\u307e\u305b\u3093";
  display: block;
  padding: 10px;
  color: #999;
  font-size: 12px;
  text-align: center;
  background: #fff;
  border: 1px dashed #d7d7d7;
  border-radius: 6px;
}

.block-item {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 7px 8px;
  cursor: pointer;
  user-select: none;
}

.block-item:hover { border-color: #9fc5ef; background: #f8fbff; }
.block-item.active { border-color: #1a6fc4; background: #eef5ff; }
.block-item.dragging { opacity: 0.35; }
.block-item.drop-above { border-top: 2px solid #1a6fc4; }
.block-item.drop-below { border-bottom: 2px solid #1a6fc4; }

.block-title-line {
  font-size: 12px;
  color: #444;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.block-meta-line {
  margin-top: 3px;
  font-size: 10px;
  color: #999;
}

.left-history-section .dialogue-list:empty::before {
  content: "\u307e\u3060\u5c65\u6b74\u306f\u3042\u308a\u307e\u305b\u3093";
  display: block;
  padding: 10px;
  color: #999;
  font-size: 12px;
  text-align: center;
  background: #fff;
  border: 1px dashed #d7d7d7;
  border-radius: 6px;
}

.left-history-section .dlg-item {
  align-items: flex-start;
  gap: 7px;
  padding: 7px;
}

.left-history-section .dlg-avatar,
.left-history-section .dlg-no-avatar {
  width: 32px;
  height: 32px;
}

.left-history-section .dlg-actions {
  flex-direction: column;
  gap: 3px;
}

.left-history-section .dlg-actions button {
  padding: 2px 6px;
}

.dlg-item {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: grab;
  user-select: none;
  transition: box-shadow 0.1s;
}
.dlg-item:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.dlg-item:active { cursor: grabbing; }
.dlg-item.dragging { opacity: 0.35; }
.dlg-item.drop-above { border-top: 2px solid #1a6fc4; }
.dlg-item.drop-below { border-bottom: 2px solid #1a6fc4; }

.dlg-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid #e0e0e0;
}
.dlg-no-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #e8e8e8;
  flex-shrink: 0;
}
.dlg-info { flex: 1; min-width: 0; }
.dlg-name { font-size: 11px; color: #888; font-weight: 700; margin-bottom: 2px; }
.dlg-text { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.dlg-actions { display: flex; gap: 4px; flex-shrink: 0; }
.dlg-actions button {
  padding: 3px 8px;
  font-size: 11px;
  border: 1px solid #ddd;
  background: #f5f5f5;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
}
.dlg-actions button:hover { background: #eaeaea; }
.dlg-actions .btn-del { color: #c00; border-color: #f0cccc; }
.dlg-actions .btn-del:hover { background: #fff0f0; }

/* =========== 蜿ｳ繝壹う繝ｳ: 繝励Ξ繝薙Η繝ｼ =========== */
.export-section {
  margin-bottom: 12px;
}
.btn-copy {
  display: block;
  width: 100%;
  padding: 9px;
  background: #1e9e50;
  color: #fff;
  border: none;
  border-radius: 5px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
}
.btn-copy:hover { background: #27b85e; }
.btn-copy.secondary {
  margin-top: 7px;
  background: #1a6fc4;
}
.btn-copy.secondary:hover { background: #2280d8; }
.copy-toast {
  display: none;
  margin-top: 6px;
  background: #333;
  color: #fff;
  padding: 5px 10px;
  border-radius: 4px;
  font-size: 12px;
  text-align: center;
}

/* 繝励Ξ繝薙Η繝ｼ螟匁棧 */
#preview-area {
  background: #fff;
  border-radius: 6px;
  border: 1px solid #ddd;
  overflow: hidden;
}

/*
  #preview-inner 繧貞ｮ滄圀縺ｮ繝壹・繧ｸ縺ｨ蜷後§蟇ｸ豕輔〒繝ｬ繝ｳ繝繝ｪ繝ｳ繧ｰ縺励・  zoom 縺ｧ邵ｮ蟆上☆繧九％縺ｨ縺ｧ謾ｹ陦御ｽ咲ｽｮ繧貞ｮ溽黄縺ｨ螳悟・荳閾ｴ縺輔○繧九・  蟷・830px ﾃ・zoom 0.38 竕・315px・医ヱ繝阪Ν蟷・340 - padding 24・・*/
#preview-inner {
  width: 830px;
  zoom: 0.38;
  padding: 16px;
  box-sizing: border-box;
}

/* 莉･荳九・ existing.html 縺ｮ蛟､繧偵◎縺ｮ縺ｾ縺ｾ菴ｿ逕ｨ */
#preview-inner .chat,
#preview-modal-inner .chat {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
  position: relative;
  z-index: 0;
}
#preview-inner .chat .bubble,
#preview-modal-inner .chat .bubble,
#preview-inner .chat .bubble-think,
#preview-modal-inner .chat .bubble-think,
#preview-inner .chat .bubble-path,
#preview-modal-inner .chat .bubble-path {
  max-width: 520px;
  left: -10px;
}
#preview-inner .avatar-block,
#preview-modal-inner .avatar-block {
  width: 150px;
  flex-shrink: 0;
  text-align: center;
  position: relative;
}
#preview-inner .chat .avatar-block,
#preview-modal-inner .chat .avatar-block {
  transform: translateX(-10px);
}
#preview-inner .symbol-overlay,
#preview-modal-inner .symbol-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 134px;
  height: 134px;
  object-fit: contain;
  pointer-events: none;
  z-index: 2;
}
#preview-inner .avatar-wrap,
#preview-modal-inner .avatar-wrap {
  display: inline-block;
  position: relative;
  isolation: isolate;
  filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.4));
  transform: translate(5px, 0);
}
#preview-inner .avatar-wrap::before,
#preview-modal-inner .avatar-wrap::before {
  content: none;
}
#preview-inner .avatar,
#preview-modal-inner .avatar {
  width: 134px;
  height: 134px;
  object-fit: contain;
  -webkit-mask-image: linear-gradient(to bottom, #000 0 95%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0 95%, transparent 100%);
  border-radius: 6px;
  display: block;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
#preview-inner,
#preview-modal-inner {
  --dialogue-outline-color: #b8b8b8;
  --dialogue-bubble-outline-color: #b8b8b8;
  --dialogue-bubble-shadow: none;
  --dialogue-tail-shadow-display: none;
  --dialogue-thought-dot-shadow: none;
  --dialogue-svg-shadow-display: none;
  --dialogue-action-shadow: none;
}
#preview-inner.use-dialogue-shadows,
#preview-modal-inner.use-dialogue-shadows {
  --dialogue-bubble-shadow:
    4px 5px 0 var(--bc-shadow, rgba(207,207,207,0.55)),
    1px 2px 5px rgba(0,0,0,0.24);
  --dialogue-tail-shadow-display: block;
  --dialogue-thought-dot-shadow:
    2px 2px 0 var(--bc-shadow, rgba(207,207,207,0.55)),
    1px 2px 4px rgba(0,0,0,0.20);
  --dialogue-svg-shadow-display: inline;
  --dialogue-action-shadow:
    4px 5px 0 rgba(120,120,120,0.55),
    1px 2px 5px rgba(0,0,0,0.18);
}
#preview-inner .name,
#preview-modal-inner .name {
  margin-top: 1px;
  font-family: 'Kosugi Maru','Hiragino Maru Gothic ProN',sans-serif;
  font-size: 14px;
  color: #555;
  font-weight: 700;
}
#preview-inner .bubble,
#preview-modal-inner .bubble {
  position: relative;
  max-width: 520px;
  padding: 18px 24px;
  border: 2px solid var(--dialogue-bubble-outline-color);
  border-radius: 22px;
  background: #fff;
  box-sizing: border-box;
  font-size: 20px;
  font-weight: 500;

        </div>
        <div id="photo-fields" style="display:none">
          <div class="form-row">
            <label>写真</label>
            <button class="btn-photo-pick" onclick="document.getElementById('photo-pick-input').click()">
              クリックして画像を選ぶ
            </button>
            <input type="file" id="photo-pick-input" accept="image/*" style="display:none" onchange="onPhotoPickSelect(event)">
            <img id="photo-pick-thumb" style="display:none">
            <div id="photo-pick-name"></div>
          </div>
          <div class="form-row">
            <label>サイズ</label>
            <div class="size-toggle">
              <button class="size-btn" data-size="25%" onclick="setPhotoSize('25%')">25%</button>
              <button class="size-btn" data-size="50%" onclick="setPhotoSize('50%')">50%</button>
              <button class="size-btn active" data-size="100%" onclick="setPhotoSize('100%')">100%</button>
              <button class="size-btn" data-size="150%" onclick="setPhotoSize('150%')">150%</button>
            </div>
          </div>
          <div class="form-row">
            <label>フレーム</label>
            <div class="frame-toggle">
              <button class="frame-btn active" data-frame="paper" onclick="setPhotoFrame('paper')">紙フレーム</button>
              <button class="frame-btn" data-frame="none" onclick="setPhotoFrame('none')">フレームなし</button>
            </div>
          </div>
        </div>
        <div class="form-row">
          <label id="text-label">セリフ</label>
          <div class="textarea-toolbar">
            <button class="font-btn" id="font-default-btn" onclick="setFont('default')">デフォ</button>
            <button class="font-btn" id="font-mincho-btn" onclick="setFont('mincho')" style="font-family:serif;">明朝</button>
            <button class="font-btn" id="font-pop-btn" onclick="setFont('pop')" style="font-family:'Kosugi Maru',sans-serif;">ポップ</button>
            <div class="toolbar-sep"></div>
            <button class="toolbar-btn bold-btn" onclick="insertBold()" title="選択テキストを太字に"><b>B</b></button>
            <button class="toolbar-btn" onclick="insertSize('large')" title="選択テキストを大きく">大</button>
            <button class="toolbar-btn" onclick="insertSize('small')" title="選択テキストを小さく">小</button>
          </div>
          <textarea id="bubble-text" placeholder="セリフを入力..."></textarea>
        </div>
        <button class="btn-primary" id="add-btn" onclick="commitDialogue()">追加</button>
        <button class="btn-cancel" id="cancel-btn" onclick="cancelEdit()">キャンセル</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">プレビュー・書き出し</div>
    <div class="panel-body">
      <div id="preview-area" onclick="openPreviewModal()">
        <div id="preview-bg"></div>
        <div id="preview-bg-overlay"></div>
        <div id="preview-inner">
          <div id="preview-block-title"></div>
          <div id="preview-dialogue-box">
            <div id="preview-empty">会話を追加するとここに表示されます</div>
          </div>
        </div>
        <div id="preview-hint">クリックで拡大</div>
      </div>
      <div class="bg-section">
        <button class="btn-bg-upload" onclick="document.getElementById('bg-input').click()">背景画像をセット</button>
        <button class="btn-bg-clear" id="btn-bg-clear" style="display:none" onclick="clearBgImage()">クリア</button>
        <input type="file" id="bg-input" accept="image/*" style="display:none" onchange="onBgSelect(event)">
      </div>
      <div class="export-section">
        <button class="btn-copy secondary" onclick="openAllPreviewModal()">一括プレビュー</button>
      </div>
      <div class="export-section">
        <div class="path-input-wrap">
          <label>書き出し画像パス</label>
          <input type="text" id="export-path" value="../assets/toolassets/" placeholder="example: ../assets/toolassets/">
        </div>
        <div class="path-input-wrap">
          <label>写真パス（記事内写真）</label>
          <input type="text" id="export-photo-path" value="../assets/reviews/hihyo/photos/" placeholder="example: ../assets/reviews/hihyo/photos/">
        </div>
        <div class="path-input-wrap">
          <label>背景画像パス（会話カード）</label>
          <input type="text" id="export-background-path" value="" placeholder="例: ../assets/reviews/00-共通/gesen1.jpeg" oninput="syncBackgroundExportPath(this.value)">
        </div>
        <button class="btn-copy" onclick="copyHTML()">現在ブロックのHTMLをコピー</button>
        <button class="btn-copy secondary" onclick="copyAllHTML()">全ブロックのHTMLをコピー</button>
        <button class="btn-copy secondary" onclick="exportDialogueText()">会話テキストを書き出し</button>
        <div class="copy-toast" id="copy-toast">クリップボードにコピーしました</div>
      </div>
    </div>
  </div>

</div>

<div id="preview-modal" onclick="onModalBgClick(event)">
  <div id="preview-modal-box">
    <div id="preview-modal-bg"></div>
    <div id="preview-modal-bg-overlay"></div>
    <button id="preview-modal-close" onclick="closePreviewModal()">x</button>
    <div id="preview-modal-title">プレビュー</div>
    <div id="preview-modal-inner"></div>
  </div>
</div>

<script>
let images = [];
let assetDirHandle = null;
let dialogue = [];
let blockTitle = '';
let editingId = null;
let selectedImageId = null;
let selectedSymbolId = null;
let dragSrcId = null;
let blockDragSrcId = null;
let formMode = 'chat';
let bgDataUrl = null;
let bgExportPath = '';
let selectedPhotoDataUrl = null;
let selectedPhotoFilename = null;
let selectedPhotoSize = '100%';
let selectedPhotoFrame = 'paper';
let selectedFont = 'default';
let selectedBubbleShape = 'normal';
let blocks = [];
let activeBlockId = null;

const BUBBLE_SHAPES = {
  normal: '通常',
  think: '考え',
  spiky: 'トゲトゲ',
  prickly: 'ちくちく',
  'cloud-speech': '雲しっぽ',
  'cloud-thought': '雲考え丸'
};

const FONTS = {
  default: { label: '\u30c7\u30d5\u30a9', css: "'Hiragino Sans','Yu Gothic',sans-serif" },
  mincho:  { label: '\u660e\u671d\u4f53', css: "'Yu Mincho','Hiragino Mincho ProN',serif" },
  pop:     { label: '\u30dd\u30c3\u30d7', css: "'Kosugi Maru','Hiragino Maru Gothic ProN',sans-serif" }
};

function setFont(font) {
  const activeEl = document.activeElement;
  const fromFontButton =
    (window.event?.target?.classList?.contains?.('font-btn')) ||
    (activeEl?.classList?.contains?.('font-btn'));
  if (fromFontButton) {
    insertFont(font);
    return;
  }
  selectedFont = FONTS[font] ? font : 'default';
  document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
}

function setBubbleShape(shape) {
  selectedBubbleShape = BUBBLE_SHAPES[shape] ? shape : 'normal';
  document.querySelectorAll('.bubble-shape-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.shape === selectedBubbleShape);
  });
}

function resetDialogueDecorations() {
  selectedSymbolId = null;
  setBubbleShape('normal');
  renderSymbolGrid();
}

const AVATAR_BASE = 134;

function avatarStyle() {
  return `width:${AVATAR_BASE}px;height:${AVATAR_BASE}px;`;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function normalizeDialogueItem(item) {
  return { type: 'chat', bubbleShape: 'normal', ...item, side: 'left' };
}

function cloneDialogueItems(items) {
  return (items || []).map(item => ({ ...normalizeDialogueItem(item) }));
}

function createBlock(title = '') {
  return {
    id: uid(),
    blockTitle: title,
    bgDataUrl: null,
    bgExportPath: '',
    dialogue: []
  };
}

function getActiveBlock() {
  return blocks.find(b => b.id === activeBlockId) || blocks[0] || null;
}

function syncActiveBlockFromState() {
  const block = getActiveBlock();
  if (!block) return;
  block.blockTitle = blockTitle;
  block.bgDataUrl = bgDataUrl;
  block.bgExportPath = bgExportPath;
  block.dialogue = cloneDialogueItems(dialogue);
  renderBlockList();
}

function loadBlockIntoState(block) {
  if (!block) return;
  activeBlockId = block.id;
  editingId = null;
  blockTitle = block.blockTitle || '';
  bgDataUrl = block.bgDataUrl || null;
  bgExportPath = block.bgExportPath || '';
  dialogue = cloneDialogueItems(block.dialogue);
  document.getElementById('block-title-input').value = blockTitle;
  document.getElementById('export-background-path').value = bgExportPath;
  cancelEdit();
  applyPreviewBg();
  renderBlockList();
  renderDialogueList();
  renderPreview();
}

function initBlockManager() {
  if (blocks.length === 0) blocks.push(createBlock(''));
  activeBlockId = activeBlockId || blocks[0].id;
  loadBlockIntoState(getActiveBlock());
}

function selectBlock(id) {
  if (id === activeBlockId) return;
  syncActiveBlockFromState();
  const next = blocks.find(b => b.id === id);
  if (next) loadBlockIntoState(next);
}

function addBlock() {
  syncActiveBlockFromState();
  const block = createBlock('');
  blocks.push(block);
  loadBlockIntoState(block);
}

function duplicateBlock() {
  syncActiveBlockFromState();
  const current = getActiveBlock();
  if (!current) return;
  const idx = blocks.findIndex(b => b.id === current.id);
  const block = {
    id: uid(),
    blockTitle: `${current.blockTitle || '無題'} コピー`,
    bgDataUrl: current.bgDataUrl || null,
    bgExportPath: current.bgExportPath || '',
    dialogue: cloneDialogueItems(current.dialogue)
  };
  blocks.splice(idx + 1, 0, block);
  loadBlockIntoState(block);
}

function deleteActiveBlock() {
  if (blocks.length <= 1) {
    if (!confirm('最後のブロックを空にしますか？')) return;
    blocks = [createBlock('')];
    activeBlockId = blocks[0].id;
    loadBlockIntoState(blocks[0]);
    return;
  }
  const current = getActiveBlock();
  if (!current || !confirm('現在の会話ブロックを削除しますか？')) return;
  const idx = blocks.findIndex(b => b.id === current.id);
  blocks.splice(idx, 1);
  loadBlockIntoState(blocks[Math.max(0, idx - 1)]);
}

function moveActiveBlock(delta) {
  syncActiveBlockFromState();
  const idx = blocks.findIndex(b => b.id === activeBlockId);
  const nextIdx = idx + delta;
  if (idx < 0 || nextIdx < 0 || nextIdx >= blocks.length) return;
  const [moved] = blocks.splice(idx, 1);
  blocks.splice(nextIdx, 0, moved);
  renderBlockList();
}

function renderBlockList() {
  const list = document.getElementById('block-list');
  if (!list) return;
  list.innerHTML = '';
  blocks.forEach((block, idx) => {
    const div = document.createElement('div');
    div.className = 'block-item' + (block.id === activeBlockId ? ' active' : '');
    div.draggable = true;
    div.dataset.id = block.id;
    const title = block.blockTitle || `無題ブロック ${idx + 1}`;
    const count = (block.dialogue || []).length;
    div.innerHTML = `
      <div class="block-title-line">${idx + 1}. ${h(title)}</div>
      <div class="block-meta-line">${count}件${block.bgDataUrl ? '・背景あり' : ''}</div>
    `;
    div.addEventListener('click', () => selectBlock(block.id));
    div.addEventListener('dragstart', e => {
      blockDragSrcId = block.id;
      setTimeout(() => div.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    div.addEventListener('dragend', () => {
      div.classList.remove('dragging');
      list.querySelectorAll('.block-item').forEach(el => el.classList.remove('drop-above', 'drop-below'));
    });
    div.addEventListener('dragover', e => {
      e.preventDefault();
      if (blockDragSrcId === block.id) return;
      const mid = div.getBoundingClientRect().top + div.offsetHeight / 2;
      list.querySelectorAll('.block-item').forEach(el => el.classList.remove('drop-above', 'drop-below'));
      div.classList.add(e.clientY < mid ? 'drop-above' : 'drop-below');
    });
    div.addEventListener('dragleave', () => div.classList.remove('drop-above', 'drop-below'));
    div.addEventListener('drop', e => {
      e.preventDefault();
      if (blockDragSrcId === block.id) return;
      syncActiveBlockFromState();
      const mid = div.getBoundingClientRect().top + div.offsetHeight / 2;
      const insertBefore = e.clientY < mid;
      const srcIdx = blocks.findIndex(b => b.id === blockDragSrcId);
      const [moved] = blocks.splice(srcIdx, 1);
      const tgtIdx = blocks.findIndex(b => b.id === block.id);
      blocks.splice(insertBefore ? tgtIdx : tgtIdx + 1, 0, moved);
      renderBlockList();
    });
    list.appendChild(div);
  });
}

function setFormMode(mode) {
  formMode = mode;
  document.getElementById('mode-chat-btn').classList.toggle('active', mode === 'chat');
  document.getElementById('mode-action-btn').classList.toggle('active', mode === 'action');
  document.getElementById('mode-photo-btn').classList.toggle('active', mode === 'photo');
  document.getElementById('chat-fields').style.display = mode === 'chat' ? '' : 'none';
  document.getElementById('photo-fields').style.display = mode === 'photo' ? '' : 'none';
  document.querySelector('.textarea-toolbar').style.display = mode === 'photo' ? 'none' : '';
  if (mode === 'chat') {
    document.getElementById('text-label').textContent = 'セリフ';
    document.getElementById('bubble-text').placeholder = 'セリフを入力...';
  } else if (mode === 'action') {
    document.getElementById('text-label').textContent = 'ト書き';
    document.getElementById('bubble-text').placeholder = 'ト書きを入力...';
  } else {
    document.getElementById('text-label').textContent = 'キャプション（任意）';
    document.getElementById('bubble-text').placeholder = 'キャプションを入力...（省略可）';
  }
}

function setBlockTitle(value) {
  blockTitle = value.trim();
  const block = getActiveBlock();
  if (block) block.blockTitle = blockTitle;
  renderBlockList();
  renderBlockTitle();
}

function renderBlockTitle() {
  const titleEl = document.getElementById('preview-block-title');
  if (!titleEl) return;
  titleEl.innerHTML = blockTitle ? `<p class="blue-tag">${h(blockTitle)}</p>` : '';
}

function setPhotoSize(size) {
  selectedPhotoSize = size;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.toggle('active', b.dataset.size === size));
}

function setPhotoFrame(frame) {
  selectedPhotoFrame = frame === 'none' ? 'none' : 'paper';
  document.querySelectorAll('.frame-btn').forEach(b => b.classList.toggle('active', b.dataset.frame === selectedPhotoFrame));
}

function onPhotoPickSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    selectedPhotoDataUrl = ev.target.result;
    selectedPhotoFilename = file.name;
    const thumb = document.getElementById('photo-pick-thumb');
    thumb.src = ev.target.result;
    thumb.style.display = 'block';
    document.getElementById('photo-pick-name').textContent = file.name;
    document.querySelector('.btn-photo-pick').textContent = '画像を変更する';
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function insertBold() {
  insertWrappedText('<b>', '</b>');
}

function insertSize(size) {
  if (size !== 'large' && size !== 'small') return;
  insertWrappedText(`<size=${size}>`, '</size>');
}

function insertWrappedText(openTag, closeTag) {
  const ta = document.getElementById('bubble-text');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const val = ta.value;
  const selected = val.substring(start, end);
  ta.value = val.substring(0, start) + openTag + selected + closeTag + val.substring(end);
  ta.selectionStart = start + openTag.length;
  ta.selectionEnd = start + openTag.length + selected.length;
  ta.focus();
}

function insertFont(font) {
  if (!FONTS[font]) return;
  document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
  insertWrappedText(`<font=${font}>`, '</font>');
}

function buildCharactersMap() {
  const charMap = {};
  images.forEach(img => {
    charMap[img.filename] = { type: img.type || 'char', charName: img.charName, exprLabel: img.exprLabel, symbolLabel: img.symbolLabel || '', charColor: img.charColor || '', src: img.src || '' };
  });
  return charMap;
}

function setAssetUpdateInfo(message) {
  const info = document.getElementById('asset-update-info');
  if (info) info.textContent = message;
}

function saveCharacters() {
  if (!images.length) { alert('登録された画像がありません。'); return; }
  const charMap = buildCharactersMap();
  const blob = new Blob([JSON.stringify(charMap, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'characters.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('drop-zone').addEventListener('dragover', e => {
  e.preventDefault();
  document.getElementById('drop-zone').classList.add('drag-over');
});
document.getElementById('drop-zone').addEventListener('dragleave', () => {
  document.getElementById('drop-zone').classList.remove('drag-over');
});
document.getElementById('drop-zone').addEventListener('drop', e => {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});

function isImageAssetName(name) {
  return /\.(png|jpe?g|gif|webp|avif)$/i.test(name || '');
}

async function readCharactersJsonFromHandle(dirHandle) {
  try {
    const fileHandle = await dirHandle.getFileHandle('characters.json');
    const file = await fileHandle.getFile();
    return JSON.parse(await file.text());
  } catch {
    return {};
  }
}

async function readImageFilesFromHandle(dirHandle) {
  const files = [];
  for await (const entry of dirHandle.values()) {
    if (entry.kind !== 'file' || !isImageAssetName(entry.name)) continue;
    files.push(await entry.getFile());
  }
  files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  return files;
}

async function loadManagedAssetFolder() {
  if (!assetDirHandle) return;
  const charMap = await readCharactersJsonFromHandle(assetDirHandle);
  const imgFiles = await readImageFilesFromHandle(assetDirHandle);
  document.getElementById('folder-info').textContent = `${assetDirHandle.name}（${imgFiles.length}件）`;
  loadImagesWithCharMap(imgFiles, charMap, normalizeExportPath(document.getElementById('export-path')?.value || '../assets/toolassets/'));
  setAssetUpdateInfo(`素材一覧を読み込みました。新規素材は未設定、削除済み素材は一覧から外れます。`);
}

async function openManagedAssetFolder() {
  if (!window.showDirectoryPicker) {
    alert('このブラウザでは直接更新に対応していません。通常の「画像フォルダを選択」と「characters.jsonとして保存」を使ってください。');
    return;
  }
  try {
    assetDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await loadManagedAssetFolder();
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    alert('素材フォルダの読み込みに失敗しました。');
  }
}

async function reloadManagedAssetFolder() {
  if (!assetDirHandle) {
    alert('先に「素材フォルダを開いて更新」で素材フォルダを選んでください。');
    return;
  }
  await loadManagedAssetFolder();
}

async function updateCharactersJsonDirect() {
  if (!assetDirHandle) {
    alert('先に「素材フォルダを開いて更新」で素材フォルダを選んでください。');
    return;
  }
  if (!images.length) { alert('登録された画像がありません。'); return; }
  try {
    const fileHandle = await assetDirHandle.getFileHandle('characters.json', { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(buildCharactersMap(), null, 2));
    await writable.close();
    setAssetUpdateInfo('characters.jsonを素材フォルダへ直接更新しました。');
    showExportToast('characters.jsonを直接更新しました');
  } catch {
    alert('characters.jsonの直接更新に失敗しました。通常の保存ボタンでダウンロードしてください。');
  }
}

function onFolderSelect(e) {
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (!files.length) return;
  const folderPath = files[0].webkitRelativePath.split('/')[0];
  document.getElementById('folder-info').textContent = folderPath;
  const jsonFile = files.find(f => f.name === 'characters.json');
  const imgFiles = files.filter(f => f.type.startsWith('image/'));
  if (jsonFile) {
    const reader = new FileReader();
    reader.onload = ev => {
      let charMap = {};
      try { charMap = JSON.parse(ev.target.result); } catch {}
      loadImagesWithCharMap(imgFiles, charMap, normalizeExportPath(document.getElementById('export-path')?.value || '../assets/toolassets/'));
    };
    reader.readAsText(jsonFile);
  } else {
    loadImagesWithCharMap(imgFiles, {}, normalizeExportPath(document.getElementById('export-path')?.value || '../assets/toolassets/'));
  }
}

function loadImagesWithCharMap(imgFiles, charMap, srcPrefix = '') {
  // 素材フォルダを再読み込みしても、同名ファイルは会話データの imageId を維持する。
  // これにより「プロジェクト読込→素材更新」でもアイコンの紐付けが切れない。
  const existingByFilename = new Map(images.map(image => [image.filename, image]));
  images = [];
  selectedImageId = null;
  let loaded = 0;
  if (!imgFiles.length) { renderImageGrid(); renderCharSelect(); return; }
  imgFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const meta = charMap[file.name] || {};
      const existing = existingByFilename.get(file.name);
      const im = new Image();
      im.onload = () => {
        images.push({ id: existing?.id || uid(), filename: file.name, dataUrl: ev.target.result, src: meta.src || (srcPrefix ? srcPrefix + file.name : ''), type: meta.type || 'char', charName: meta.charName || '', exprLabel: meta.exprLabel || '', symbolLabel: meta.symbolLabel || '', charColor: meta.charColor || '', nw: im.naturalWidth, nh: im.naturalHeight });
        loaded++;
        if (loaded === imgFiles.length) {
          images.sort((a, b) => a.filename.localeCompare(b.filename, undefined, { numeric: true }));
          renderImageGrid();
          renderCharSelect();
        }
      };
      im.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function onFileSelect(e) {
  handleFiles(e.target.files);
  e.target.value = '';
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const im = new Image();
      im.onload = () => {
        const srcPrefix = normalizeExportPath(document.getElementById('export-path')?.value || '../assets/toolassets/');
        images.push({ id: uid(), filename: file.name, dataUrl: ev.target.result, src: srcPrefix + file.name, type: 'char', charName: '', exprLabel: '', symbolLabel: '', nw: im.naturalWidth, nh: im.naturalHeight });
        renderImageGrid();
        renderCharSelect();
      };
      im.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function removeImage(id) {
  images = images.filter(i => i.id !== id);
  if (selectedImageId === id) selectedImageId = null;
  if (selectedSymbolId === id) selectedSymbolId = null;
  renderImageGrid();
  renderCharSelect();
  renderPreview();
}

function renderImageGrid() {
  const grid = document.getElementById('image-grid');
  grid.innerHTML = '';
  images.forEach(img => {
    const type = img.type || 'char';
    const isChar = type !== 'symbol' && type !== 'nametag';
    const card = document.createElement('div');
    card.className = 'img-card' + (isChar && selectedImageId === img.id ? ' selected' : '');
    const typeToggleHtml = `
      <div class="img-type-toggle">

    } else if (type === 'nametag') {
      card.innerHTML = `
        <img class="img-thumb" src="${img.dataUrl}" alt="${h(img.filename)}" style="object-fit:contain;background:#f0f0f0;">
        <div class="img-filename">${h(img.filename)}</div>
        ${typeToggleHtml}
        <span class="nametag-badge">名札</span>
        <input type="text" placeholder="キャラクター名（例：山本）" value="${h(img.charName)}" data-id="${img.id}" data-field="charName">
        <button class="btn-remove" title="削除" onclick="event.stopPropagation();removeImage('${img.id}')">x</button>`;
    } else {
      const colorVal = img.charColor || '#cfcfcf';
      card.innerHTML = `
        <img class="img-thumb" src="${img.dataUrl}" alt="${h(img.filename)}">
        <div class="img-filename">${h(img.filename)}</div>
        ${typeToggleHtml}
        <input type="text" placeholder="キャラクター名" value="${h(img.charName)}" data-id="${img.id}" data-field="charName">
        <input type="text" placeholder="表情ラベル（例：通常）" value="${h(img.exprLabel)}" data-id="${img.id}" data-field="exprLabel">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:3px;">
          <span style="font-size:10px;color:#888;">枠色</span>
          <input type="color" value="${colorVal}" data-id="${img.id}" data-field="charColor" style="width:32px;height:20px;border:1px solid #ccc;border-radius:3px;cursor:pointer;padding:1px;">
        </div>
        <button class="btn-remove" title="削除" onclick="event.stopPropagation();removeImage('${img.id}')">x</button>`;
      card.addEventListener('click', () => { selectedImageId = img.id; renderImageGrid(); onCharSelect(false); });
    }
    card.querySelectorAll('[data-settype]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const target = images.find(i => i.id === btn.dataset.id);
        if (!target) return;
        target.type = btn.dataset.settype;
        if (btn.dataset.settype !== 'char' && selectedImageId === target.id) selectedImageId = null;
        renderImageGrid();
        renderCharSelect();
        renderPreview();
      });
    });
    card.querySelectorAll('input[type=text], input[type=color]').forEach(inp => {
      inp.addEventListener('click', e => e.stopPropagation());
      const onValueChange = e => {
        const target = images.find(i => i.id === e.target.dataset.id);
        if (target) {
          target[e.target.dataset.field] = e.target.value;
          if (type === 'symbol') renderSymbolGrid(); else renderCharSelect();
          renderPreview();
        }
        if (e.type === 'change' && e.target.type === 'color') {
          e.target.blur();
          const tmp = document.createElement('input');
          tmp.type = 'text';
          tmp.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
          document.body.appendChild(tmp);
          tmp.focus();
          requestAnimationFrame(() => { tmp.blur(); document.body.removeChild(tmp); });
        }
      };
      inp.addEventListener('input', onValueChange);
      inp.addEventListener('change', onValueChange);
    });
    grid.appendChild(card);
  });
}

function getCharNames() {
  return [...new Set(images.filter(i => i.type !== 'symbol' && i.type !== 'nametag').map(i => i.charName).filter(Boolean))];
}

function getNametagForChar(charName) {
  return images.find(i => i.type === 'nametag' && i.charName === charName) || null;
}

function getBubbleColor(charName) {
  const img = images.find(i => i.charName === charName && i.type !== 'symbol' && i.type !== 'nametag' && i.charColor);
  return img ? img.charColor : null;
}

function colorWithAlpha(color, alpha) {
  const c = String(color || '#cfcfcf').trim();
  const hex = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if (hex) {
    let raw = hex[1];
    if (raw.length === 3) raw = raw.split('').map(ch => ch + ch).join('');
    const r = parseInt(raw.slice(0, 2), 16);
    const g = parseInt(raw.slice(2, 4), 16);
    const b = parseInt(raw.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  const rgb = c.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
  if (rgb) return `rgba(${rgb[1]},${rgb[2]},${rgb[3]},${alpha})`;
  return c;
}

function getSymbols() {
  return images.filter(i => i.type === 'symbol');
}

function renderSymbolGrid() {
  const grid = document.getElementById('symbol-grid');
  grid.innerHTML = '';
  const symbols = getSymbols();
  if (!symbols.length) {
    grid.innerHTML = '<span style="font-size:11px;color:#bbb">（記号画像なし）</span>';
    selectedSymbolId = null;
    return;
  }
  const noneDiv = document.createElement('div');
  noneDiv.className = 'symbol-item';
  const noneThumb = document.createElement('div');
  noneThumb.className = 'symbol-thumb' + (!selectedSymbolId ? ' selected' : '');
  noneThumb.textContent = 'x';
  noneThumb.style.cssText = 'display:flex;align-items:center;justify-content:center;color:#bbb;font-size:18px;font-weight:bold;cursor:pointer;';
  noneThumb.addEventListener('click', () => { selectedSymbolId = null; renderSymbolGrid(); });
  const noneLabel = document.createElement('div');
  noneLabel.className = 'symbol-label';
  noneLabel.textContent = 'なし';
  noneDiv.appendChild(noneThumb);
  noneDiv.appendChild(noneLabel);
  grid.appendChild(noneDiv);
  symbols.forEach(sym => {
    const wrap = document.createElement('div');
    wrap.className = 'symbol-item';
    const thumb = document.createElement('img');
    thumb.className = 'symbol-thumb' + (selectedSymbolId === sym.id ? ' selected' : '');
    thumb.src = sym.dataUrl;
    thumb.title = sym.symbolLabel || sym.filename;
    thumb.addEventListener('click', () => { selectedSymbolId = selectedSymbolId === sym.id ? null : sym.id; renderSymbolGrid(); });
    const label = document.createElement('div');
    label.className = 'symbol-label';
    label.textContent = sym.symbolLabel || sym.filename;
    wrap.appendChild(thumb);
    wrap.appendChild(label);
    grid.appendChild(wrap);

}

function renderCharSelect() {
  const sel = document.getElementById('char-select');
  const prev = sel.value;
  sel.innerHTML = '<option value="">-- 選択 --</option>';
  getCharNames().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  if (prev) sel.value = prev;
  onCharSelect(false);
  renderSymbolGrid();
}

function onCharSelect(applyDefaultSide = false) {
  const charName = document.getElementById('char-select').value;
  const grid = document.getElementById('expr-grid');
  grid.innerHTML = '';
  if (!charName) return;
  images.filter(i => i.charName === charName && i.type !== 'symbol' && i.type !== 'nametag').forEach(img => {
    const wrap = document.createElement('div');
    wrap.className = 'expr-item';
    wrap.innerHTML = `
      <div class="expr-thumb-clip ${selectedImageId === img.id ? 'selected' : ''}"

        <img class="expr-thumb-inner" src="${img.dataUrl}">

      <div class="expr-label">${h(img.exprLabel || img.filename)}</div>

  });
}

function commitDialogue() {
  const text = document.getElementById('bubble-text').value.trim();
  if (formMode === 'photo') {
    if (!selectedPhotoDataUrl) { alert('写真を選択してください。'); return; }
    if (editingId) {
      const item = dialogue.find(d => d.id === editingId);
      if (item) { item.type = 'photo'; item.dataUrl = selectedPhotoDataUrl; item.filename = selectedPhotoFilename; item.text = text; item.size = selectedPhotoSize; item.photoFrame = selectedPhotoFrame; delete item.imageId; delete item.symbolId; }
      cancelEdit();
    } else {
      dialogue.push({ id: uid(), type: 'photo', dataUrl: selectedPhotoDataUrl, filename: selectedPhotoFilename, text, size: selectedPhotoSize, photoFrame: selectedPhotoFrame });
      document.getElementById('bubble-text').value = '';
      selectedPhotoDataUrl = null;
      selectedPhotoFilename = null;
      selectedPhotoSize = '100%';
      selectedPhotoFrame = 'paper';
      const thumb = document.getElementById('photo-pick-thumb');
      thumb.src = '';
      thumb.style.display = 'none';
      document.getElementById('photo-pick-name').textContent = '';
      document.querySelector('.btn-photo-pick').textContent = 'クリックして画像を選ぶ';
      setPhotoSize('100%');
      setPhotoFrame('paper');
    }
    renderDialogueList();
    renderPreview();
    syncActiveBlockFromState();
    return;
  }
  if (formMode === 'action') {
    if (!text) { alert('ト書きを入力してください。'); return; }
    if (editingId) {
      const item = dialogue.find(d => d.id === editingId);
      if (item) { item.type = 'action'; item.text = text; item.font = selectedFont; delete item.imageId; }
      cancelEdit();
    } else {
      dialogue.push({ id: uid(), type: 'action', text, font: selectedFont });
      document.getElementById('bubble-text').value = '';
    }
  } else {
    const charName = document.getElementById('char-select').value;
    if (!charName || !selectedImageId || !text) {
      alert('キャラクター・表情・セリフをすべて入力してください。');
      return;
    }
    if (editingId) {
      const item = dialogue.find(d => d.id === editingId);
      if (item) { item.type = 'chat'; item.imageId = selectedImageId; item.text = text; item.symbolId = selectedSymbolId || null; item.font = selectedFont; item.bubbleShape = selectedBubbleShape; item.side = 'left'; }
      cancelEdit();
    } else {
      dialogue.push({ id: uid(), type: 'chat', imageId: selectedImageId, text, symbolId: selectedSymbolId || null, font: selectedFont, bubbleShape: selectedBubbleShape, side: 'left' });
      document.getElementById('bubble-text').value = '';
      resetDialogueDecorations();
    }
  }
  renderDialogueList();
  renderPreview();
  syncActiveBlockFromState();
}

function startEdit(id) {
  const item = dialogue.find(d => d.id === id);
  if (!item) return;
  editingId = id;
  if (item.type === 'action') {
    setFormMode('action');
  } else if (item.type === 'photo') {
    setFormMode('photo');
    selectedPhotoDataUrl = item.dataUrl;
    selectedPhotoFilename = item.filename;
    selectedPhotoSize = item.size || '100%';
    selectedPhotoFrame = item.photoFrame === 'none' ? 'none' : 'paper';
    const thumb = document.getElementById('photo-pick-thumb');
    thumb.src = item.dataUrl;
    thumb.style.display = 'block';
    document.getElementById('photo-pick-name').textContent = item.filename;
    document.querySelector('.btn-photo-pick').textContent = '画像を変更する';
    setPhotoSize(selectedPhotoSize);
    setPhotoFrame(selectedPhotoFrame);
  } else {
    setFormMode('chat');
    const img = images.find(i => i.id === item.imageId);
    if (img) {
      document.getElementById('char-select').value = img.charName;
      selectedImageId = item.imageId;
      onCharSelect(false);
    }
    selectedSymbolId = item.symbolId || null;
    setBubbleShape(item.bubbleShape || 'normal');
    renderSymbolGrid();
  }
  document.getElementById('bubble-text').value = item.text;
  setFont(item.font || 'default');
  document.getElementById('form-title').textContent = 'ブロックを編集';
  document.getElementById('add-btn').textContent = '更新';
  document.getElementById('add-btn').classList.add('is-update');
  document.getElementById('cancel-btn').style.display = 'block';
  document.getElementById('bubble-text').focus();
}

function cancelEdit() {
  editingId = null;
  selectedFont = 'default';
  setFont('default');
  resetDialogueDecorations();
  selectedPhotoDataUrl = null;
  selectedPhotoFilename = null;
  selectedPhotoSize = '100%';
  selectedPhotoFrame = 'paper';
  const thumb = document.getElementById('photo-pick-thumb');
  thumb.src = '';
  thumb.style.display = 'none';
  document.getElementById('photo-pick-name').textContent = '';
  document.querySelector('.btn-photo-pick').textContent = 'クリックして画像を選ぶ';

function onBgSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      bgDataUrl = await normalizeBgImage(ev.target.result);
    } catch (err) {
      console.warn('背景画像の変換に失敗したため、元画像を使用します。', err);
      bgDataUrl = ev.target.result;
    }
    if (!bgExportPath) {
      const backgroundDir = '../assets/reviews/00-共通/';
      bgExportPath = backgroundDir + file.name;
      document.getElementById('export-background-path').value = bgExportPath;
    }
    applyPreviewBg();
    document.getElementById('btn-bg-clear').style.display = '';
    syncActiveBlockFromState();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function normalizeBgImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxSide = 1600;
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      if (scale === 1 && dataUrl.length < 1500000) {
        resolve(dataUrl);
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.88));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function clearBgImage() {
  bgDataUrl = null;
  applyPreviewBg();
  document.getElementById('btn-bg-clear').style.display = 'none';
  syncActiveBlockFromState();
}

function applyPreviewBg() {
  const box = document.getElementById('preview-dialogue-box');
  const title = document.getElementById('preview-block-title');
  if (bgDataUrl) {
    box.style.setProperty('--preview-bg-image', `url(${bgDataUrl})`);
    box.classList.add('has-bg');
    if (title) title.classList.add('has-bg-title');
  } else {
    box.style.removeProperty('--preview-bg-image');
    box.classList.remove('has-bg');
    if (title) title.classList.remove('has-bg-title');
  }
}

// ===== 莨夊ｩｱ繝ｪ繧ｹ繝域緒逕ｻ =====
function renderDialogueList() {
  const list = document.getElementById('dialogue-list');
  list.innerHTML = '';
  dialogue.forEach(item => {
    const div = document.createElement('div');
    div.className = 'dlg-item' + (item.type === 'action' ? ' is-action' : item.type === 'photo' ? ' is-photo' : '');
    div.draggable = true;
    div.dataset.id = item.id;
    let contentHtml;
    if (item.type === 'action') {
      contentHtml = `
        <div class="dlg-action-label">ト書き</div>
        <div class="dlg-info">
          <div class="dlg-text">${h(item.text)}</div>
        </div>`;
    } else if (item.type === 'photo') {
      contentHtml = `
        <div style="flex-shrink:0;">
          <img src="${item.dataUrl}" style="width:38px;height:38px;object-fit:cover;border-radius:4px;border:1px solid #d0c8f0;">
        </div>
        <div class="dlg-info">
          <div class="dlg-name" style="color:#6c5ce7">写真</div>
          <div class="dlg-text">${h(item.filename)} <span style="color:#aaa">・${item.photoFrame === 'none' ? 'フレームなし' : '紙フレーム'}</span>${item.text ? ' - ' + h(item.text) : ''}</div>
        </div>`;
    } else {
      const img = images.find(i => i.id === item.imageId);
      const sym = item.symbolId ? images.find(i => i.id === item.symbolId) : null;
      const symBadgeHtml = sym
        ? `<img src="${sym.dataUrl}" alt="" title="${h(sym.symbolLabel || sym.filename)}" style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;object-fit:contain;">`
        : '';
      const avatarHtml = img
        ? `<div style="position:relative;flex-shrink:0;"><img class="dlg-avatar" src="${img.dataUrl}" alt="">${symBadgeHtml}</div>`
        : `<div class="dlg-no-avatar"></div>`;
      const nameText = img ? (img.charName || img.filename) : '不明';
      const shapeLabel = BUBBLE_SHAPES[item.bubbleShape || 'normal'];
      contentHtml = `
        ${avatarHtml}
        <div class="dlg-info">
          <div class="dlg-name">${h(nameText)} <span style="font-weight:400;color:#aaa">${h(shapeLabel)}</span></div>
          <div class="dlg-text">${h(item.text)}</div>
        </div>`;
    }
    div.innerHTML = `
      ${contentHtml}
      <div class="dlg-actions">
        <button onclick="startEdit('${item.id}')">編集</button>
        <button class="btn-del" onclick="deleteDialogue('${item.id}')">削除</button>
      </div>
    `;
    div.addEventListener('dragstart', e => {
      dragSrcId = item.id;
      setTimeout(() => div.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    div.addEventListener('dragend', () => {
      div.classList.remove('dragging');
      list.querySelectorAll('.dlg-item').forEach(el => el.classList.remove('drop-above', 'drop-below'));
    });
    div.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragSrcId === item.id) return;
      const mid = div.getBoundingClientRect().top + div.offsetHeight / 2;
      list.querySelectorAll('.dlg-item').forEach(el => el.classList.remove('drop-above', 'drop-below'));
      div.classList.add(e.clientY < mid ? 'drop-above' : 'drop-below');
    });
    div.addEventListener('dragleave', () => div.classList.remove('drop-above', 'drop-below'));
    div.addEventListener('drop', e => {
      e.preventDefault();
      if (dragSrcId === item.id) return;
      const mid = div.getBoundingClientRect().top + div.offsetHeight / 2;
      const insertBefore = e.clientY < mid;
      const srcIdx = dialogue.findIndex(d => d.id === dragSrcId);
      const [moved] = dialogue.splice(srcIdx, 1);
      const tgtIdx = dialogue.findIndex(d => d.id === item.id);
      dialogue.splice(insertBefore ? tgtIdx : tgtIdx + 1, 0, moved);
      renderDialogueList();
      renderPreview();
      syncActiveBlockFromState();
    });
    list.appendChild(div);
  });
}

function bubbleMarkup(item, bubbleStyle, content, svgHtml = '') {
  const shape = item.bubbleShape || 'normal';
  const idAttr = ` data-dialogue-id="${h(item.id)}"`;
  if (shape === 'normal') {
    const svg = svgHtml || '<svg aria-hidden="true"><path></path></svg>';
    return `<div class="bubble-path bubble-normal-path" data-bubble-shape="normal"${idAttr}${bubbleStyle}>${svg}<div class="bubble-path-text">${content}</div></div>`;
  }
  if (shape === 'prickly') {
    const svg = svgHtml || '<svg aria-hidden="true"><path></path></svg>';
    return `<div class="bubble-path bubble-prickly-path" data-bubble-shape="prickly"${idAttr}${bubbleStyle}>${svg}<div class="bubble-path-text">${content}</div></div>`;
  }
  if (shape === 'think') return `<div class="bubble-think"${bubbleStyle}>${content}</div>`;

  if (shape === 'spiky') {
    const svg = svgHtml || '<svg aria-hidden="true"><path></path></svg>';
    return `<div class="bubble-path bubble-spiky-path" data-bubble-shape="spiky"${idAttr}${bubbleStyle}>${svg}<div class="bubble-path-text">${content}</div></div>`;
  }

  const tail = shape === 'cloud-thought' ? 'thought' : 'speech';
  const svg = svgHtml || (tail === 'thought'
    ? '<svg aria-hidden="true"><path></path><circle class="cloud-thought-dot cloud-thought-dot-large"></circle><circle class="cloud-thought-dot cloud-thought-dot-small"></circle></svg>'
    : '<svg aria-hidden="true"><path></path></svg>');
  return `<div class="bubble-path bubble-cloud-path" data-bubble-shape="cloud" data-cloud-tail="${tail}"${idAttr}${bubbleStyle}>${svg}<div class="bubble-path-text">${content}</div></div>`;
}

function makeBubbleSegments(length, preferred) {
  const count = Math.max(1, Math.round(length / preferred));
  return { count, size: length / count };
}

function updateBubblePath(bubble) {
  const svg = bubble.querySelector('svg');
  const path = svg && svg.querySelector('path:not(.svg-bubble-shadow)');
  if (!svg || !path) return;
  svg.querySelectorAll('.svg-bubble-shadow, .svg-dot-shadow').forEach(el => el.remove());
  const shape = bubble.dataset.bubbleShape || 'normal';
  const isNormal = shape === 'normal';
  const isPrickly = shape === 'prickly';
  const isSpiky = shape === 'spiky';
  const tail = bubble.dataset.cloudTail || (isNormal || isPrickly ? 'speech' : 'none');
  const isRight = false;
  const tailSpace = isNormal || isPrickly ? 28 : tail === 'speech' || tail === 'thought' ? 42 : isSpiky ? 24 : 10;
  const padLeft = tailSpace;
  const padRight = 10;
  const padY = 10;
  const width = bubble.offsetWidth + padLeft + padRight;
  const height = bubble.offsetHeight + padY * 2;
  const edge = 12;
  if (isNormal || isPrickly) {
    const radius = 20;
    const left = padLeft + 2;
    const top = edge;
    const right = width - edge;
    const bottom = height - edge;
    const anchorY = Math.min(top + radius + 10, bottom - radius - 8);
    let d;
    if (!isPrickly) {
      d = [
        `M ${left + radius} ${top}`,
        `H ${right - radius}`,
        `Q ${right} ${top} ${right} ${top + radius}`,
        `V ${bottom - radius}`,
        `Q ${right} ${bottom} ${right - radius} ${bottom}`,
        `H ${left + radius}`,
        `Q ${left} ${bottom} ${left} ${bottom - radius}`,
        `V ${anchorY + 10}`,
        `L ${left - 18} ${anchorY}`,
        `L ${left} ${anchorY - 10}`,
        `V ${top + radius}`,
        `Q ${left} ${top} ${left + radius} ${top}`,
        'Z'
      ].join(' ');
    } else {
      const thorn = 6;
      const thornBase = 12;
      const thornHorizontal = (from, to, y, outward) => {
        const dir = to >= from ? 1 : -1;
        const length = Math.abs(to - from);
        const count = Math.max(1, Math.ceil(length / 42));
        const size = length / count;
        const parts = [];
        for (let i = 0; i < count; i++) {
          const start = from + dir * size * i;
          const end = from + dir * size * (i + 1);
          const mid = start + dir * size * 0.5;
          if (size > 24) {
            parts.push(`L ${mid - dir * thornBase / 2} ${y}`);
            parts.push(`L ${mid} ${y + outward * thorn}`);
            parts.push(`L ${mid + dir * thornBase / 2} ${y}`);
          }
          parts.push(`L ${end} ${y}`);
        }
        return parts;
      };
      const thornVertical = (x, from, to, outward) => {
        const dir = to >= from ? 1 : -1;
        const length = Math.abs(to - from);
        const count = Math.max(1, Math.ceil(length / 30));
        const size = length / count;
        const parts = [];
        for (let i = 0; i < count; i++) {
          const start = from + dir * size * i;
          const end = from + dir * size * (i + 1);
          const mid = start + dir * size * 0.5;
          if (size > 16) {
            parts.push(`L ${x} ${mid - dir * thornBase / 2}`);
            parts.push(`L ${x + outward * thorn} ${mid}`);
            parts.push(`L ${x} ${mid + dir * thornBase / 2}`);
          }
          parts.push(`L ${x} ${end}`);
        }
        return parts;
      };
      const parts = [`M ${left + radius} ${top}`];
      parts.push(...thornHorizontal(left + radius, right - radius, top, -1));
      parts.push(`Q ${right} ${top} ${right} ${top + radius}`);
      parts.push(...thornVertical(right, top + radius, bottom - radius, 1));
      parts.push(`Q ${right} ${bottom} ${right - radius} ${bottom}`);
      parts.push(...thornHorizontal(right - radius, left + radius, bottom, 1));
      parts.push(`Q ${left} ${bottom} ${left} ${bottom - radius}`);
      parts.push(...thornVertical(left, bottom - radius, anchorY + 10, -1));
      parts.push(`L ${left - 18} ${anchorY}`);
      parts.push(`L ${left} ${anchorY - 10}`);
      parts.push(`V ${top + radius}`);
      parts.push(`Q ${left} ${top} ${left + radius} ${top}`);
      parts.push('Z');
      d = parts.join(' ');
    }
    svg.style.left = `${-padLeft}px`;
    svg.style.top = `${-padY}px`;
    svg.style.width = `${width}px`;
    svg.style.height = `${height}px`;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.style.transform = '';
    svg.style.transformOrigin = 'center';
    const shadowPath = path.cloneNode(false);
    shadowPath.setAttribute('class', 'svg-bubble-shadow');
    shadowPath.setAttribute('transform', 'translate(4 5)');
    shadowPath.setAttribute('d', d);
    svg.insertBefore(shadowPath, path);
    path.setAttribute('d', d);
    return;
  }
  const corner = isSpiky ? 15 : 18;
  const depth = isSpiky ? 10 : 13;
  const left = padLeft + 2;
  const top = edge;
  const right = width - edge;
  const bottom = height - edge;
  const horizontal = makeBubbleSegments(right - left - corner * 2, 30);
  const vertical = makeBubbleSegments(bottom - top - corner * 2, isSpiky ? 28 : 26);
  let d = `M ${left + corner} ${top}`;

  for (let i = 0; i < horizontal.count; i++) {
    d += isSpiky
      ? ` l ${horizontal.size / 2} ${-depth} l ${horizontal.size / 2} ${depth}`
      : ` q ${horizontal.size / 2} ${-depth} ${horizontal.size} 0`;
  }
  d += isSpiky
    ? ` L ${right + depth} ${top - depth} L ${right} ${top + corner}`
    : ` Q ${right} ${top} ${right} ${top + corner}`;
  for (let i = 0; i < vertical.count; i++) {
    d += isSpiky
      ? ` l ${depth} ${vertical.size / 2} l ${-depth} ${vertical.size / 2}`
      : ` q ${depth} ${vertical.size / 2} 0 ${vertical.size}`;
  }
  d += isSpiky
    ? ` L ${right + depth} ${bottom + depth} L ${right - corner} ${bottom}`
    : ` Q ${right} ${bottom} ${right - corner} ${bottom}`;
  for (let i = 0; i < horizontal.count; i++) {
    d += isSpiky
      ? ` l ${-horizontal.size / 2} ${depth} l ${-horizontal.size / 2} ${-depth}`
      : ` q ${-horizontal.size / 2} ${depth} ${-horizontal.size} 0`;
  }
  d += isSpiky
    ? ` L ${left - depth} ${bottom + depth} L ${left} ${bottom - corner}`
    : ` Q ${left} ${bottom} ${left} ${bottom - corner}`;
  if (tail === 'speech') {
    const anchorY = Math.min(top + 32, bottom - corner - 12);
    const upperClear = 10;
    const lowerLength = bottom - corner - (anchorY + 11);
    if (lowerLength > 0) {
      const lower = makeBubbleSegments(lowerLength, isSpiky ? 28 : 26);
      for (let i = 0; i < lower.count; i++) {
        d += isSpiky
          ? ` l ${-depth} ${-lower.size / 2} l ${depth} ${-lower.size / 2}`
          : ` q ${-depth} ${-lower.size / 2} 0 ${-lower.size}`;
      }
    }
    d += ` L ${left - 18} ${anchorY} L ${left} ${anchorY - 11}`;
    const upperResumeY = anchorY - 11 - upperClear;
    d += ` L ${left} ${upperResumeY}`;
    const upperLength = upperResumeY - (top + corner);
    if (upperLength > 0) {
      const upper = makeBubbleSegments(upperLength, isSpiky ? 28 : 26);
      for (let i = 0; i < upper.count; i++) {
        d += isSpiky
          ? ` l ${-depth} ${-upper.size / 2} l ${depth} ${-upper.size / 2}`
          : ` q ${-depth} ${-upper.size / 2} 0 ${-upper.size}`;
      }
    }
  } else {
    for (let i = 0; i < vertical.count; i++) {
      if (isSpiky) {
        const spikeDepth = i === vertical.count - 1 ? depth + 10 : depth;
        d += ` l ${-spikeDepth} ${-vertical.size / 2} l ${spikeDepth} ${-vertical.size / 2}`;
      } else {
        d += ` q ${-depth} ${-vertical.size / 2} 0 ${-vertical.size}`;
      }
    }
  }
  d += isSpiky
    ? ` L ${left - depth} ${top - depth} L ${left + corner} ${top} Z`
    : ` Q ${left} ${top} ${left + corner} ${top} Z`;

  svg.style.left = `${isRight ? -padRight : -padLeft}px`;
  svg.style.top = `${-padY}px`;
  svg.style.width = `${width}px`;
  svg.style.height = `${height}px`;
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.style.transform = isRight ? 'scaleX(-1)' : '';
  svg.style.transformOrigin = 'center';
  const shadowPath = path.cloneNode(false);
  shadowPath.setAttribute('class', 'svg-bubble-shadow');
  shadowPath.setAttribute('transform', `translate(${isRight ? -4 : 4} 5)`);
  shadowPath.setAttribute('d', d);
  svg.insertBefore(shadowPath, path);
  path.setAttribute('d', d);

  if (!isSpiky && tail === 'thought') {
    const anchorY = Math.min(top + 32, bottom - corner - 12);
    const large = svg.querySelector('.cloud-thought-dot-large');
    const small = svg.querySelector('.cloud-thought-dot-small');
    const dotShadowX = isRight ? -2 : 2;
    large.setAttribute('cx', left - 18);
    large.setAttribute('cy', anchorY + 3);
    large.setAttribute('r', 7);
    small.setAttribute('cx', left - 33);
    small.setAttribute('cy', anchorY + 10);
    small.setAttribute('r', 4);
    const largeShadow = large.cloneNode(false);
    largeShadow.setAttribute('class', 'svg-dot-shadow');
    largeShadow.setAttribute('cx', left - 18 + dotShadowX);
    largeShadow.setAttribute('cy', anchorY + 5);
    const smallShadow = small.cloneNode(false);
    smallShadow.setAttribute('class', 'svg-dot-shadow');
    smallShadow.setAttribute('cx', left - 33 + dotShadowX);
    smallShadow.setAttribute('cy', anchorY + 12);
    svg.insertBefore(smallShadow, small);
    svg.insertBefore(largeShadow, large);
  }
}

function updateBubblePaths(root = document) {
  root.querySelectorAll('.bubble-path').forEach(updateBubblePath);
}
