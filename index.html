<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>testsite</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;
}

#bg-photos {
  position: fixed;
  inset: 0;
  z-index: -1;
}
.bg-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(2px);
  transform: scale(1.02);
  transition: opacity 2s ease;
}

#page1 {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

#page2 {
  height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  /* 背景なし → fixed の #bg-photos が透けて見える */
}

/* 4:3 の画面エリア */
#page2-inner {
  position: relative;
  aspect-ratio: 4 / 3;
  width: min(100vw, calc(100vh * 4 / 3));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 6%;
  gap: 28px;
  background: url('assets/ui/555.png') center center / cover no-repeat;
  overflow: hidden;
  z-index: 2;

  /* ベゼル風の枠 */
  border: 6px solid #1c1c1c;
  border-radius: 6px;
  outline: 2px solid #555;
  outline-offset: -1px;

  /* 外側の影（奥行き感）＋うっすら画面グロー */
  box-shadow:
    0 0 0 8px #2a2a2a,          /* ベゼル外縁 */
    0 16px 60px rgba(0,0,0,0.9),/* 落ち影 */
    0 0 120px rgba(0,0,0,0.55), /* アンビエント影 */
    inset 0 0 90px rgba(0,0,0,0.30); /* スクリーン内側ビネット */
}

/* ゲーム風セリフウィンドウ */
@keyframes p2-blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

#p2-dialog {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  margin: 0 3% 2.5%;
  padding: 16px 28px 20px;
  min-height: 18%;
  background: rgba(4, 8, 30, 0.92);
  border: 2px solid #5577cc;
  border-radius: 4px;
  color: #ddeeff;
  font-family: 'Hiragino Sans', 'ヒラギノ角ゴシック', '游ゴシック', 'Yu Gothic', 'Meiryo', sans-serif;
  font-size: clamp(14px, 1.9vw, 20px);
  line-height: 1.75;
  box-shadow:
    inset 0 0 0 1px rgba(80, 120, 255, 0.18),
    0 -4px 30px rgba(20, 50, 200, 0.25);
}

/* ページ遷移オーバーレイ */
#page-transition {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: opacity 0.5s ease;
}
#page-transition.active {
  opacity: 1;
  pointer-events: all;
}

#p2-dialog-name {
  position: absolute;
  top: -2.1em;
  left: 14px;
  padding: 3px 16px;
  background: #2244aa;
  border: 2px solid #5577cc;
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  color: #fff;
  font-size: 0.9em;
  font-weight: bold;
  white-space: nowrap;
  letter-spacing: 0.05em;
}

#p2-dialog-cursor {
  position: absolute;
  bottom: 8px;
  right: 16px;
  color: #7799ee;
  font-size: 0.85em;
  animation: p2-blink 1.1s ease-in-out infinite;
}

#page2-menyu {
  width: clamp(220px, 36vw, 520px);
  height: auto;
  pointer-events: none;
}

#page2-nav {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#page2-nav a.btn {
  display: block;
  padding: 14px 48px;
  text-align: center;
  text-decoration: none;
  color: #111;
  border: 2px solid #111;
  font-size: 1.1rem;
  background: #fff;
}

#page2-nav a.btn:hover {
  background: #111;
  color: #fff;
  box-shadow: 0 0 0 3px #ffe000, 0 0 12px rgba(255, 224, 0, 0.55);
}

#page-divider {
  position: relative;
  width: 100%;
  z-index: 1;
  line-height: 0;
}

#page-divider img {
  width: 100%;
  height: auto;
  display: block;
}

.p2-sakebi {
  position: absolute;
  top: 6%;
  left: 50%;
  transform: translateX(-50%);
  width: 20vw;
  height: auto;
  pointer-events: none;
  z-index: 3;
}

.p2-chars {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 40px;
  align-items: flex-end;
  z-index: 1;
}

.p2-chara {
  height: 62vh;
  width: auto;
  display: block;
}

.p2-table-wrap {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 130%;
  perspective: 650px;
  z-index: 2;
}

.p2-table {
  width: 100%;
  background: #6b3a1f;
  border-top: 8px solid #a0622e;
  transform: rotateX(32deg);
  transform-origin: bottom center;
  padding: 200px 60px 80px;
  display: flex;
  gap: 24px;
  justify-content: center;
  align-items: flex-end;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
}

.p2-btn {
  padding: 16px 28px;
  font-size: 18px;
  font-family: '游明朝', serif;
  font-weight: bold;
  background: #f5f0e8;
  border: 2px solid #8b7355;
  border-radius: 6px;
  cursor: pointer;
  color: #2a1a0a;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}

.p2-left-chars {
  position: absolute;
  bottom: 0;
  left: -150px;
}

.p2-left-chars img {
  height: 60vh;
  width: auto;
  display: block;
}

.p2-right-chars {
  position: absolute;
  bottom: 0;
  right: 0;
}

.p2-right-chars img {
  height: 60vh;
  width: auto;
  display: block;
}


/* 番号表示バー */
#anim-bar {
  display: flex;
  justify-content: flex-end;
  gap: 20px;
  padding: 8px 20px;
  background: rgba(255,255,255,0.55);
  font-family: monospace;
  font-size: 14px;
  color: #555;
  flex-shrink: 0;
  position: relative;
  z-index: 3;
}
#anim-bar span { color: #111; font-weight: bold; }

/* キャラステージ */
.stage {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: visible;
  position: relative;
}

.chara {
  display: block;
  height: 80vh;
  width: auto;
  position: relative;
  z-index: 2;
}

#chara2 {
  position: relative;
  left: -100px;
  top: 20px;
}

#chara1 {
  position: relative;
  left: -70px;
}

.title-img {
  position: absolute;
  left: 45%;
  transform: translateX(calc(-50% + 60px));
  bottom: calc(79vh - 100px);
  max-width: 512vw;
  height: auto;
  pointer-events: none;
  z-index: 4;
}

#radial-canvas {
  position: absolute;
  left: 45%;
  transform: translateX(calc(-50% + 60px));
  bottom: calc(79vh + 230px - 14vw);
  width: clamp(300px, calc(52vw - 250px), 700px);
  height: clamp(150px, calc(26vw - 280px), 350px);
  pointer-events: none;
  z-index: 1;
  opacity: 0.92;
  background: white;
  box-shadow: 0 0 0 3px white;
}

.hukidashi-img {
  position: absolute;
  width: 13.5vw;
  height: auto;
  pointer-events: none;
  opacity: 0;
  transform-origin: bottom left;
  z-index: 2;
}


/* ====== 白フチドリ ====== */
.hukidashi-img {
  filter:
    drop-shadow( 2px  0px 0 white)
    drop-shadow(-2px  0px 0 white)
    drop-shadow( 0px  2px 0 white)
    drop-shadow( 0px -2px 0 white)
    drop-shadow( 1px  1px 0 white)
    drop-shadow(-1px  1px 0 white)
    drop-shadow( 1px -1px 0 white)
    drop-shadow(-1px -1px 0 white);
}

/* ====== アニメーション定義 ====== */

/* 1/2: 震え */
@keyframes shake {
  0%   { transform: translate(0,0) rotate(0deg); }
  15%  { transform: translate(-3px,-2px) rotate(-1deg); }
  30%  { transform: translate(3px,1px) rotate(1deg); }
  45%  { transform: translate(-2px,2px) rotate(-0.5deg); }
  60%  { transform: translate(2px,-1px) rotate(0.5deg); }
  75%  { transform: translate(-3px,1px) rotate(-1deg); }
  90%  { transform: translate(3px,-2px) rotate(1deg); }
  100% { transform: translate(0,0) rotate(0deg); }
}

/* 3/4: ぴょんぴょん */
@keyframes bounce {
  0%   { transform: translateY(0); }
  20%  { transform: translateY(-28px); }
  35%  { transform: translateY(0); }
  50%  { transform: translateY(-14px); }
  62%  { transform: translateY(0); }
  72%  { transform: translateY(-6px); }
  80%  { transform: translateY(0); }
  100% { transform: translateY(0); }
}

/* 5/6: 左右ステップ */
@keyframes step {
  0%   { transform: translateX(0); }
  20%  { transform: translateX(-18px); }
  40%  { transform: translateX(0); }
  60%  { transform: translateX(18px); }
  80%  { transform: translateX(0); }
  90%  { transform: translateX(-8px); }
  100% { transform: translateX(0); }
}

/* 7/8: くるりん（横3Dスピン） */
@keyframes kurarin {
  0%   { transform: perspective(600px) rotateY(0deg); }
  30%  { transform: perspective(600px) rotateY(360deg); }
  100% { transform: perspective(600px) rotateY(360deg); }
}

/* 9/10: 縮小パルス */
@keyframes pulse {
  0%   { transform: scale(1); }
  30%  { transform: scale(0.87); }
  55%  { transform: scale(1.03); }
  75%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}

/* 11/12: 扇形揺れ（地面支点） */
@keyframes pendulum {
  0%   { transform: rotate(0deg); }
  22%  { transform: rotate(-9deg); }
  50%  { transform: rotate(9deg); }
  78%  { transform: rotate(-9deg); }
  100% { transform: rotate(0deg); }
}
.anim-pendulum, .anim-pendulum-fast { transform-origin: bottom center; }

/* 13/14: 呼吸 */
@keyframes breathe {
  0%   { transform: scaleY(1) scaleX(1); }
  35%  { transform: scaleY(1.05) scaleX(0.97); }
  70%  { transform: scaleY(0.97) scaleX(1.02); }
  100% { transform: scaleY(1) scaleX(1); }
}

/* 15/16: のびる */
@keyframes stretch {
  0%   { transform: scaleY(1) scaleX(1); }
  20%  { transform: scaleY(1.18) scaleX(0.88); }
  40%  { transform: scaleY(0.88) scaleX(1.08); }
  60%  { transform: scaleY(1.06) scaleX(0.96); }
  80%  { transform: scaleY(0.97) scaleX(1.02); }
  100% { transform: scaleY(1) scaleX(1); }
}

/* 17/18: のけぞる（地面支点で後方へ傾く） */
@keyframes leanback {
  0%   { transform: rotate(0deg); }
  28%  { transform: rotate(-13deg); }
  50%  { transform: rotate(3deg); }
  72%  { transform: rotate(-5deg); }
  100% { transform: rotate(0deg); }
}
.anim-leanback, .anim-leanback-fast { transform-origin: bottom center; }

/* リコシェ（反射暴れ）[aggressive] */
@keyframes ricochet {
  0%   { transform: translate(  0px,  0px); }
  10%  { transform: translate( 20px, -6px); }
  22%  { transform: translate(-18px,-12px); }
  31%  { transform: translate( 15px, -4px); }
  45%  { transform: translate(-22px,-10px); }
  54%  { transform: translate( 11px,-14px); }
  65%  { transform: translate(-16px, -2px); }
  77%  { transform: translate( 20px, -8px); }
  88%  { transform: translate( -8px,-10px); }
  100% { transform: translate(  0px,  0px); }
}

/* 2点ホップステップ [aggressive] */
@keyframes step2 {
  0%   { transform: translate(-26px,  0px); }
  10%  { transform: translate(-26px,  0px); }
  30%  { transform: translate(  0px,-22px); }
  50%  { transform: translate( 26px,  0px); }
  60%  { transform: translate( 26px,  0px); }
  80%  { transform: translate(  0px,-22px); }
  100% { transform: translate(-26px,  0px); }
}

/* 19/20: 時計回り回転 [aggressive] */
@keyframes spin-cw {
  0%   { transform: rotate(0deg); }
  30%  { transform: rotate(360deg); }
  100% { transform: rotate(360deg); }
}

/* 21/22: 反時計回り回転 [aggressive] */
@keyframes spin-ccw {
  0%   { transform: rotate(0deg); }
  30%  { transform: rotate(-360deg); }
  100% { transform: rotate(-360deg); }
}

/* 首傾け [passive] */
@keyframes tilt {
  0%   { transform: rotate(0deg); }
  15%  { transform: rotate(7deg); }
  55%  { transform: rotate(7deg); }
  75%  { transform: rotate(-2deg); }
  90%  { transform: rotate(0deg); }
  100% { transform: rotate(0deg); }
}
.anim-tilt, .anim-tilt-fast { transform-origin: bottom center; }

/* 首傾け逆 [passive] */
@keyframes tilt-r {
  0%   { transform: rotate(0deg); }
  15%  { transform: rotate(-7deg); }
  55%  { transform: rotate(-7deg); }
  75%  { transform: rotate(2deg); }
  90%  { transform: rotate(0deg); }
  100% { transform: rotate(0deg); }
}
.anim-tilt-r, .anim-tilt-r-fast { transform-origin: bottom center; }

/* にじり [passive] */
@keyframes creep {
  0%   { transform: translateX(0); }
  22%  { transform: translateX(-9px); }
  44%  { transform: translateX(-14px); }
  66%  { transform: translateX(5px); }
  84%  { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}

/* モノクロ [passive] */
@keyframes monochrome {
  0%   { filter: grayscale(0); }
  50%  { filter: grayscale(1); }
  90%  { filter: grayscale(1); }
  100% { filter: grayscale(0); }
}

/* 発光 */
@keyframes glow {
  0%   { filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  22%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  23.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  25%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  26.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  28%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  29.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  31%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  32.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  34%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  35.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  37%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  38.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  40%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  41.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  43%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  44.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  46%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  47.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  49%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  50.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  52%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  53.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  55%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  56.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  58%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  59.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  61%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  62.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  64%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  65.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }
  67%  { filter: brightness(20) drop-shadow(0 0 30px rgba(255,255,255,1)); }
  68.5%{ filter: brightness(1)  drop-shadow(0 0  0px rgba(255,255,255,0)); }

/* 2倍拡大＋高速震え */
@keyframes grow2x-shake {
  0%    { transform: scale(1); }
  22%   { transform: scale(2); }
  23.0% { transform: scale(2) translate(-3px,-2px) rotate(-1deg);  animation-timing-function: steps(1,end); }
  23.5% { transform: scale(2) translate( 3px, 1px) rotate( 1deg);  animation-timing-function: steps(1,end); }
  24.0% { transform: scale(2) translate(-2px, 2px) rotate(-0.5deg);animation-timing-function: steps(1,end); }
  24.5% { transform: scale(2) translate( 2px,-1px) rotate( 0.5deg);animation-timing-function: steps(1,end); }
  25.0% { transform: scale(2) translate(-3px, 1px) rotate(-1deg);  animation-timing-function: steps(1,end); }
  25.5% { transform: scale(2) translate( 3px,-2px) rotate( 1deg);  animation-timing-function: steps(1,end); }
  26.0% { transform: scale(2) translate(-3px,-2px) rotate(-1deg);  animation-timing-function: steps(1,end); }
  26.5% { transform: scale(2) translate( 3px, 1px) rotate( 1deg);  animation-timing-function: steps(1,end); }
  27.0% { transform: scale(2) translate(-2px, 2px) rotate(-0.5deg);animation-timing-function: steps(1,end); }
  27.5% { transform: scale(2) translate( 2px,-1px) rotate( 0.5deg);animation-timing-function: steps(1,end); }
  28.0% { transform: scale(2) translate(-3px, 1px) rotate(-1deg);  animation-timing-function: steps(1,end); }
  28.5% { transform: scale(2) translate( 3px,-2px) rotate( 1deg);  animation-timing-function: steps(1,end); }
  29.0% { transform: scale(2) translate(-3px,-2px) rotate(-1deg);  animation-timing-function: steps(1,end); }
  29.5% { transform: scale(2) translate( 3px, 1px) rotate( 1deg);  animation-timing-function: steps(1,end); }
  30.0% { transform: scale(2) translate(-2px, 2px) rotate(-0.5deg);animation-timing-function: steps(1,end); }
  30.5% { transform: scale(2) translate( 2px,-1px) rotate( 0.5deg);animation-timing-function: steps(1,end); }
  31.0% { transform: scale(2) translate(-3px, 1px) rotate(-1deg);  animation-timing-function: steps(1,end); }
  31.5% { transform: scale(2) translate( 3px,-2px) rotate( 1deg);  animation-timing-function: steps(1,end); }
  32.0% { transform: scale(2) translate(-3px,-2px) rotate(-1deg);  animation-timing-function: steps(1,end); }
  32.5% { transform: scale(2) translate( 3px, 1px) rotate( 1deg);  animation-timing-function: steps(1,end); }
  33.0% { transform: scale(2) translate(-2px, 2px) rotate(-0.5deg);animation-timing-function: steps(1,end); }

/* retreat（ササッと後ずさり→ゆっくり帰還）[passive] */
@keyframes retreat {
  0%   { transform: translateX(0)     translateY(0);    animation-timing-function: ease-out; }
  3%   { transform: translateX(70px)  translateY(-6px); animation-timing-function: ease-in;  }
  7%   { transform: translateX(160px) translateY(0);    }
  43%  { transform: translateX(160px) translateY(0);    animation-timing-function: linear;   }
  100% { transform: translateX(0)     translateY(0);    }
}

/* retreat-slow（ゆっくり後ずさり→ササッと帰還）[passive] */
@keyframes retreat-slow {
  0%   { transform: translateX(0)     translateY(0);    animation-timing-function: linear;   }
  57%  { transform: translateX(160px) translateY(0);    }
  93%  { transform: translateX(160px) translateY(0);    animation-timing-function: ease-in;  }
  96%  { transform: translateX(80px)  translateY(-6px); animation-timing-function: ease-out; }
  100% { transform: translateX(0)     translateY(0);    }
}

/* look-around（左右確認） */
@keyframes look-around {
  0%   { transform: perspective(600px) rotateY(0deg); }
  8%   { transform: perspective(600px) rotateY(-180deg); }
  30%  { transform: perspective(600px) rotateY(-180deg); }
  40%  { transform: perspective(600px) rotateY(0deg); }
  50%  { transform: perspective(600px) rotateY(180deg); }
  72%  { transform: perspective(600px) rotateY(180deg); }
  84%  { transform: perspective(600px) rotateY(0deg); }
  100% { transform: perspective(600px) rotateY(0deg); }
}

/* wobble（ぐにゃぐにゃ変形） */
@keyframes wobble {
  0%   { transform: scaleX(1)    scaleY(1); }
  20%  { transform: scaleX(1.18) scaleY(0.87); }
  40%  { transform: scaleX(0.88) scaleY(1.14); }
  60%  { transform: scaleX(1.14) scaleY(0.90); }
  80%  { transform: scaleX(0.92) scaleY(1.10); }
  100% { transform: scaleX(1)    scaleY(1); }
}

/* shudder（ぷるぷる高周波振動） */
@keyframes shudder {
  0%   { transform: translate(0,    0); }
  12%  { transform: translate(-2px,  1px); }
  25%  { transform: translate( 2px, -1px); }
  37%  { transform: translate(-1px,  2px); }
  50%  { transform: translate( 2px,  1px); }
  62%  { transform: translate(-2px, -1px); }
  75%  { transform: translate( 1px,  2px); }
  87%  { transform: translate(-1px, -2px); }
  100% { transform: translate(0,    0); }
}

/* swagger（いきがり横揺れ） */
@keyframes swagger {
  0%   { transform: translateX(0px)   rotate(0deg); }
  25%  { transform: translateX(-14px) rotate(-2.5deg); }
  50%  { transform: translateX(0px)   rotate(0deg); }
  75%  { transform: translateX(14px)  rotate(2.5deg); }
  100% { transform: translateX(0px)   rotate(0deg); }
}

/* tippy（つまさき立ち） */
@keyframes tippy {
  0%   { transform: scaleY(1); }
  25%  { transform: scaleY(1.12); }
  55%  { transform: scaleY(1.12); }
  68%  { transform: scaleY(0.97); }
  82%  { transform: scaleY(1.05); }
  100% { transform: scaleY(1); }
}
.anim-wobble,  .anim-wobble-fast  { transform-origin: bottom center; }
.anim-tippy,   .anim-tippy-fast   { transform-origin: bottom center; }

function pickRandom(current, allowAggressive, allowPassive) {
  const currentGroup = ANIM_GROUPS.find(g => g.includes(current));
  const choices = ANIMS.filter(a => {
    if (currentGroup && currentGroup.includes(a)) return false;
    if (!allowAggressive && AGGRESSIVE.has(a)) return false;
    if (!allowPassive   && PASSIVE.has(a))     return false;
    return true;
  });
  return choices[Math.floor(Math.random() * choices.length)];
}

function setAnim(el, labelEl, allowAggressive, allowPassive) {
  const current = ANIMS.find(a => el.classList.contains(a)) || null;
  const next = pickRandom(current, allowAggressive, allowPassive);
  ANIMS.forEach(a => el.classList.remove(a));
  el.classList.add(next);
  if (labelEl) labelEl.textContent = animNo(next);
}

  do { next = Math.floor(Math.random() * CHARA2_SRCS.length); } while (next === current);

}

function switchChara2(onDone) {
  const needsReturn = chara2.classList.contains('anim-grow2x-shake') ||
                      chara2.classList.contains('anim-grow2x-stretch') ||
                      chara2.classList.contains('anim-shrink-half-shake') ||

  function doSwitch() {
    chara2.style.transition = '';
    chara2CurrentSrc = pickNextSrc(chara2CurrentSrc);
    chara2.src = CHARA2_SRCS[chara2CurrentSrc];
    setAnim(chara2, label2, true);
    if (onDone) onDone(ANIMS.find(a => chara2.classList.contains(a)));

  if (needsReturn) {

    requestAnimationFrame(() => {

  ];

  const SHOW_MIN  = 2200;
  const SHOW_MAX  = 3800;
  const BURST_GAP = 160;

  function rand(range) { return Math.random() * range - range / 2; }

  function popOne(el, flipped, group) {
    el.src = group[Math.floor(Math.random() * group.length)];

    const stageRect = stage.getBoundingClientRect();
    const bw = el.offsetWidth  || 200;
    const bh = el.offsetHeight || 120;

    const shrinkAnims = ['anim-shrink-half-shake', 'anim-shrink-half-stretch'];

    let bx, by;
    if (!flipped) {
      // chara1（右キャラ）の右上：バブルの左下をキャラの右肩に合わせる
      const r = chara1.getBoundingClientRect();
      const shrunk = shrinkAnims.some(a => chara1.classList.contains(a));
      bx = r.right - stageRect.left + 10 + rand(150) + (shrunk ? 100 : 0);
      by = r.top   - stageRect.top + r.height * 0.1 - bh + rand(130) + 200 - (shrunk ? 50 : 0);
    } else {
      // chara2（左キャラ）の左上：バブルの右下をキャラの左肩に合わせる（画像反転）
      const r = chara2.getBoundingClientRect();
      const shrunk = shrinkAnims.some(a => chara2.classList.contains(a));
      bx = r.left  - stageRect.left - bw + 10 + rand(100) - 20 - (shrunk ? 100 : 0);
      by = r.top   - stageRect.top + r.height * 0.1 - bh + rand(80) + 5 + 200 - (shrunk ? 50 : 0);
    }

    el.style.left            = bx + 'px';
    el.style.top             = by + 'px';
    el.style.transformOrigin = flipped ? 'bottom right' : 'bottom left';
    const endScale   = flipped ? 1.3  : 0.75;
    const startScale = flipped ? 0.45 : 0.27;
    el.style.transition      = 'none';
    el.style.opacity         = '0';
    el.style.transform       = flipped ? `scaleX(-1) scale(${startScale})` : `scale(${startScale})`;
    void el.offsetWidth;
    el.style.transition      = 'opacity 0.3s ease-out, transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
    el.style.opacity         = '1';
    el.style.transform       = flipped ? `scaleX(-1) scale(${endScale})` : `scale(${endScale})`;
  }

  function hideOne(el) {
    el.style.transition = 'opacity 0.25s ease-in';
    el.style.opacity    = '0';
  }

  let turn = 0;  // 0=chara1側, 1=chara2側

  function burst() {
    const flipped = (turn === 1);
    turn = 1 - turn;
    const count = flipped ? Math.ceil(Math.random() * 3) : Math.floor(Math.random() * 10) + 3;
    const side = flipped ? 'chara2' : 'chara1';
    const available = SRCS_GROUPS.filter(g => g.side === 'both' || g.side === side);
    const group = available[Math.floor(Math.random() * available.length)].srcs;
    for (let i = 0; i < count; i++) {
      setTimeout(() => popOne(els[i], flipped, group), i * BURST_GAP);
    }
    const hold = SHOW_MIN + Math.random() * (SHOW_MAX - SHOW_MIN);
    setTimeout(() => {
      for (let i = 0; i < count; i++) hideOne(els[i]);
      setTimeout(burst, 600 + Math.random() * 400);
    }, (count - 1) * BURST_GAP + hold);
  }

  setTimeout(burst, 2000);
})();


// ====== タイトル下 放射虹アニメーション ======
(function() {
  const canvas = document.getElementById('radial-canvas');
  const ctx    = canvas.getContext('2d');
  const W = 520, H = 260;
  canvas.width = W; canvas.height = H;

  const SEGS = 20;
  const cx = W / 2, cy = H / 2;
  const hw = W / 2, hh = H / 2;
  const step = (Math.PI * 2) / SEGS;

  // 固定パレット（虹7色）
  const PALETTE = [
    'hsl(  0, 95%, 55%)',  // 赤
    'hsl( 30, 95%, 55%)',  // 橙
    'hsl( 60, 95%, 55%)',  // 黄
    'hsl(120, 95%, 55%)',  // 緑
    'hsl(180, 95%, 55%)',  // 水
    'hsl(240, 95%, 55%)',  // 青
    'hsl(280, 95%, 55%)',  // 紫
  ];
  const OFFSET_SPEED = 8;  // 1秒に何ステップ進むか（速度調整はここ）

  // 角度 angle の方向に延ばした光線が長方形の辺に当たる座標を返す
  function rectEdge(angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    const tx = c !== 0 ? hw / Math.abs(c) : Infinity;
    const ty = s !== 0 ? hh / Math.abs(s) : Infinity;
    const t  = Math.min(tx, ty);
    return [cx + c * t, cy + s * t];
  }

  function frame(ts) {
    const t = ts / 1000;

    const offset = Math.floor(t * OFFSET_SPEED);

    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < SEGS; i++) {
      const a0 = i * step;
      const a1 = a0 + step;

      const colorIdx = ((i + offset) % PALETTE.length + PALETTE.length) % PALETTE.length;
      ctx.fillStyle = PALETTE[colorIdx];

      // 辺に沿って角度を細分割してポリゴンを作る
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      const SUB = 12;
      for (let j = 0; j <= SUB; j++) {
        const [ex, ey] = rectEdge(a0 + (a1 - a0) * j / SUB);
        ctx.lineTo(ex, ey);
      }
      ctx.closePath();
      ctx.fill();
    }

    // 中心白ハイライト + 縁暗
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(hw, hh));
    grad.addColorStop(0,    'rgba(255,255,255,0.5)');
    grad.addColorStop(0.18, 'rgba(255,255,255,0)');
    grad.addColorStop(0.80, 'rgba(0,0,0,0)');
    grad.addColorStop(1,    'rgba(0,0,0,0.3)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();

(function() {
  const canvas   = document.getElementById('radial-canvas');
  const titleImg = document.querySelector('.title-img');
  const stage    = document.querySelector('.stage');

  function lockOnce() {
    requestAnimationFrame(() => {
      const stageRect  = stage.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      if (!canvasRect.width) return;

      // CSS calc() で算出された現在値をpx固定値に変換
      canvas.style.width     = canvasRect.width  + 'px';
      canvas.style.height    = canvasRect.height + 'px';
      canvas.style.bottom    = Math.round(stageRect.bottom - canvasRect.bottom) + 'px';
      canvas.style.left      = Math.round(canvasRect.left  - stageRect.left)   + 'px';
      canvas.style.transform = 'none';
    });
  }

  if (titleImg.complete && titleImg.naturalWidth > 0) {
    lockOnce();
  } else {
    titleImg.addEventListener('load', lockOnce, { once: true });
  }
})();

    const item = candidates[Math.floor(Math.random() * candidates.length)];
    lastShown[mapKey] = item;
    setDialogue(item.name, item.text);
  }

  function resetDialogue() {
    setDialogue(DEFAULT_NAME, DEFAULT_TEXT);
  }

  // アイドルタイマー（再帰）
  function startIdle() {
    clearTimeout(idleTimer);
    if (!page2Active) return;
    idleTimer = setTimeout(() => {
      if (!locked && !hovering) showKey('idle');
      startIdle();  // 次のアイドルを予約（ロック・ホバー中でも継続）
    }, IDLE_WAIT);
  }

  // ---- ボタン ----
  document.querySelectorAll('#page2-nav a.btn').forEach(a => {
    // href から ".html" を除いたものをキーに使う（例: "hihyo.html" → "hihyo"）
    const btnKey = a.getAttribute('href').replace('.html', '');

    a.addEventListener('mouseenter', () => {
      if (locked) return;
      hovering = true;
      clearTimeout(idleTimer);
      showKey('btn_hover', btnKey);
    });
    a.addEventListener('mouseleave', () => {
      if (locked) return;
      hovering = false;
      startIdle();
    });
    a.addEventListener('click', () => {
      locked = true;
      hovering = false;
      showKey('btn_click');
    });
  });

  // ---- キャラ（クリックで発動） ----
  document.querySelectorAll('.p2-left-chars img, .p2-right-chars img').forEach(img => {
    img.style.cursor = 'pointer';
    img.addEventListener('click', () => {
      if (locked) return;
      clearTimeout(idleTimer);
      showKey('chara_click');
    });
  });

  // ---- page2 表示検知（IntersectionObserver） ----
  new IntersectionObserver(entries => {
    entries.forEach(entry => {
      page2Active = entry.isIntersecting;
      if (page2Active) {
        startIdle();
      } else {
        clearTimeout(idleTimer);
        locked   = false;
        hovering = false;
        resetDialogue();
      }
    });
  }, { threshold: 0.5 }).observe(document.getElementById('page2'));

})();

// ====== page2 キャラホバーアクション ======
(function() {
  const leftImg  = document.querySelector('.p2-left-chars img');   // 2_9.png
  const rightImg = document.querySelector('.p2-right-chars img');  // 1.png

  // 左キャラ（2_9）: ホバーでぴょんぴょん + 立ち絵差分を高速切り替え
  const CHARA2_ALL = Array.from({length: 13}, (_, i) => `assets/chara/2_${i + 1}.png`);
  let flipTimer = null;
  let flipIdx   = 0;

  leftImg.addEventListener('mouseenter', () => {
    leftImg.classList.add('anim-bounce-fast');
    // 立ち絵高速切り替え開始
    flipTimer = setInterval(() => {
      flipIdx = (flipIdx + 1) % CHARA2_ALL.length;
      leftImg.src = CHARA2_ALL[flipIdx];
    }, 80);
  });
  leftImg.addEventListener('mouseleave', () => {
    leftImg.classList.remove('anim-bounce-fast');
    // タイマー停止・2_9 に戻す
    clearInterval(flipTimer);
    flipTimer = null;
    flipIdx   = 0;
    leftImg.src = 'assets/chara/2_9.png';
  });

  // 右キャラ（1.png）: ホバーで逃走 → 自動で様子見帰還 → ポインタがあればまた逃げる
  let fleeing       = false;
  let fleeWaitTimer = null;  // 待機タイマー（山本発言でキャンセル可能）
  let fleeBackTimer = null;  // 帰還完了タイマー

  // 急速帰還（山本が喋ったとき用）
  function quickReturn() {
    clearTimeout(fleeWaitTimer);
    clearTimeout(fleeBackTimer);
    rightImg.style.transition = 'transform 0.3s ease-out';
    rightImg.style.transform  = 'translateX(0)';
    fleeBackTimer = setTimeout(() => {
      fleeing = false;
      rightImg.style.pointerEvents = 'auto';
    }, 350);
  }

  rightImg.addEventListener('mouseenter', () => {
    if (fleeing) return;
    fleeing = true;
    rightImg.style.pointerEvents = 'none';

    // 逃走
    rightImg.style.transition = 'transform 0.28s ease-in';
    rightImg.style.transform  = 'translateX(220%)';

    // 2400ms 待機後に「様子見」帰還
    fleeWaitTimer = setTimeout(() => {
      rightImg.style.transition = 'transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1)';
      rightImg.style.transform  = 'translateX(0)';
      fleeBackTimer = setTimeout(() => {
        fleeing = false;
        rightImg.style.pointerEvents = 'auto';
      }, 1150);
    }, 2400);
  });

  // 山本が喋ったら逃走中でも急いで戻る
  document.addEventListener('yamamoto-speaks', () => {
    if (fleeing) quickReturn();
  });
})();
</script>
