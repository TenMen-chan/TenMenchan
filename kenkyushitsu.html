<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究室</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .char-shelf {
      position: absolute;
      max-height: 50vh;
      width: auto;
      z-index: 1;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .char-row {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: center;
      width: 100vw;
      position: relative;
      z-index: 2;
    }

    .char-row > * {
      margin-right: -24px;
    }
    .char-row > *:last-child {
      margin-right: 0;
    }

    .char-row img {
      display: block;
      max-height: 50vh;
      width: auto;
    }

    .char-stack {
      position: relative;
      align-self: flex-end;
    }
    .char-stack .char-main {
      display: block;
      max-height: 50vh;
      width: auto;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <img src="assets/chara/teashelf.png" alt="teashelf" class="char-shelf">
  <div class="char-row">
    <img src="assets/chara/teatenmen.png" alt="teatenmen">
    <img src="assets/chara/teatable.png" alt="teatable">
    <div class="char-stack">
      <img src="assets/chara/1.png" alt="1" class="char-main">
    </div>
  </div>
</body>
</html>
